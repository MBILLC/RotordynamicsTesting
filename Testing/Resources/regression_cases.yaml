# Regression test cases for RotorDynamics (this repo's instance of a
# library-agnostic harness -- see HOWTO.md section 3 for how to point it at a
# different library).
#
# Every case below is lifted from a verify_*/validate_* function in
# RotorDynamics/../Resources/Notebooks/rotordynamics_validation.py -- the
# configurations the credibility report already established as physically
# correct (HOWTO.md's "use case 2"). A case doesn't have to originate that
# way: for an already-validated model you can add a case directly with your
# own choice of variables/tolerance ("use case 1") -- nothing below requires
# a validation script to exist. Recommended for a new case, though:
# generate_cases_from_views.py turns a model's own Impact Views into a
# ready-to-tune case (HOWTO.md's "use case 0") instead of typing the
# variables: list by hand -- its output lands in a separate file
# (regression_cases_generated.yaml), review and merge entries in here once
# tuned. This file is what regression_testing.py reads; it is the only place
# you need to edit to add, remove, retune or switch off a case.
#
# Fields per case:
#   name       - label; also the reference-result file stem
#                (Resources/ReferenceResults/<name>.npz)
#   enabled    - set false to skip a case without deleting it
#   model      - full Modelica class name, resolved in `workspace`
#   start_time, final_time, ncp, rtol - passed to the "dynamic" custom function
#   modifiers  - parameter overrides (empty map if none)
#   variables  - result filter: glob patterns passed to with_result_filter().
#                MUST include "time" and MUST be no broader than what the
#                comparison actually needs -- an unfiltered run of
#                JeffcottValidation stores 208 variables / ~33 MB; filtered to
#                what verify_jeffcott_response() actually reads it is 6
#                variables / ~1 MB (measured 2026-08-15, HOWTO.md section 2).
#   tolerance  - optional, overrides the global `tolerance` below for this
#                case only

# `library` is the Modelica library under test (used only to scope which
# cached FMUs get purged before each run -- see connect() in
# regression_testing.py). This harness is otherwise library-agnostic: every
# model is addressed by its full class path in each case's `model:` field, so
# pointing this file at a different library + workspace is enough to reuse it
# there unchanged.
library: RotorDynamics
workspace: rotordynamicsdevelopment
custom_function: dynamic

# Default funnel half-width for every variable: fraction of that variable's own
# value range in the reference trajectory (see HOWTO.md section 3).
tolerance: 0.001

# Per-case wall-clock cap, overriding the harness default of 300 s. This library needs a much
# larger one: its heaviest cases are full planetary stages -- 8 gear meshes, 4 carrier posts,
# 11 bearings and a modal ring, with a 6.5 kHz mesh mode setting the step size -- and a run
# that legitimately takes several minutes is not a runaway. 300 s would cancel healthy cases
# and report them as failures, which is worse than waiting. Any single case may still override
# this with its own `timeout_seconds:`.
timeout_seconds: 1200

cases:
  - name: JeffcottValidation
    enabled: true
    model: RotorDynamics.TestModels.JeffcottValidation
    start_time: 0.0
    final_time: 3.0
    ncp: 6000
    rtol: 1.0e-9
    modifiers:
      omega_run: 157.07963267948966   # 1.0 * omega_n at the as-built design point
    variables: [time, "rDisc.r_out*", wDisc.w, omega_run, rotor.flange_a.theta]

  - name: InhomogeneousRotorWhirl
    enabled: true
    model: RotorDynamics.TestModels.InhomogeneousRotorWhirl
    start_time: 0.0
    final_time: 2.0
    ncp: 8000
    rtol: 1.0e-10
    modifiers:
      omega_run: 100.89139633408524   # 0.8 * omega_n -- decaying (sub-threshold) whirl
    variables: [time, "rShaft.r_out*", "core.r_c*", omega_run]

  - name: BearingFaultDemo
    enabled: true
    model: RotorDynamics.Examples.BearingFaultDemo
    start_time: 0.0
    final_time: 0.05
    ncp: 50000
    rtol: 1.0e-9
    # bearing1.flange_a.r[1] / bearing1.flange_b.r[1] have a tiny reference
    # range -- at the file default (0.001) their funnel y-tolerance is narrow
    # enough that ordinary rtol-driven solver noise (this case is
    # re-simulated at REGRESSION_RTOL_FACTOR x looser rtol than the
    # reference -- see regression_testing.py) reads as a funnel violation
    # even though the actual deviation is far below anything physically
    # meaningful. Widened case-wide rather than per-variable. 0.005 cleared
    # this at REGRESSION_RTOL_FACTOR = 10 (2026-08-18); raising the factor to
    # 100 the same day (see the regression-testing skill's own entry on this)
    # re-broke it -- FAIL at 7.18e-10, intermittently (a same-settings rerun
    # sometimes shows 0.0), consistent with borderline solver noise right at
    # the tolerance edge rather than a real regression. Widened again to
    # 0.03, empirically verified clean across repeated reruns at the new
    # factor.
    tolerance: 0.03
    modifiers: {}
    variables: [time, "bearing1.F_imp*", "bearing1.F_sd*", bearing1.contact,
                bearing1.f_imp, bearing1.T_imp, bearing1.v_impact, bearing1.F_n,
                bearing1.t_c, bearing1.q_load, "bearing1.flange_a.r*",
                "bearing1.flange_b.r*", "bearing1.flange_a.f*", "bearing1.flange_b.f*",
                housing1.delta_y0, "rotor.v*", "rotor.flange_a.r*", rotor.flange_a.theta,
                bearing1.tau_drag, bearing1.F_pulse]

  - name: IshibashiRotorKit
    enabled: true
    model: RotorDynamics.Examples.IshibashiRotorKit
    start_time: 0.0
    final_time: 12.0
    ncp: 12000
    rtol: 1.0e-8
    modifiers:
      shaftRight.L: 0.128
    variables: [time, wRotor.w, "rRotor.r_out*", rotor.m, rotor.I_d, rotor.I_p,
                "rotor.flange_a.phi*", "rotor.flange_a.r*", "rotor.flange_b.r*"]

  - name: CouplingReactionTorque
    enabled: true
    model: RotorDynamics.TestModels.CouplingReactionTorque
    start_time: 0.0
    final_time: 0.5
    ncp: 10000
    rtol: 1.0e-10
    modifiers: {}
    variables: [time, "coupling.flange_a.*", "coupling.flange_b.*",
                coupling.e_off, coupling.a_ang, omega_run]

  - name: TorsionalOscillation
    enabled: true
    model: RotorDynamics.TestModels.TorsionalOscillation
    start_time: 0.0
    final_time: 0.6
    ncp: 12000
    rtol: 1.0e-10
    modifiers: {}
    variables: [time, disc.flange_a.theta, disc2.flange_a.theta, c_t, I_p,
                omega_t, d_t, tau_step, zeta_t]

  - name: TorsionShaftBending
    enabled: true
    model: RotorDynamics.TestModels.TorsionShaftBending
    start_time: 0.0
    final_time: 0.01
    ncp: 2
    rtol: 1.0e-9
    modifiers: {}
    variables: [time, "rTip.r_out*", "phiTip.phi_out*", r_tip_exact, phi_tip_exact]

  - name: BearingAndShafts
    enabled: true
    # NOTE: this class was renamed from RotorDynamics.TestModels.RotorOnTwoBearings
    # to BearingAndShafts on disk without updating the credibility-report notebook
    # or the .mo documentation cross-references that still say "RotorOnTwoBearings"
    # (grep the library for it). Flagged, not fixed here -- out of scope for this
    # harness.
    model: RotorDynamics.TestModels.BearingAndShafts
    start_time: 0.0
    final_time: 8.0
    ncp: 40000
    rtol: 1.0e-8
    modifiers:
      bearing1.useFault: true
      bearing1.m_ball: 5.0e-4
    variables: [time, "rotor.flange_a.r*", "rotor.v*", bearing1.contact,
                bearing1.f_imp, bearing1.q_load]

  # ── Shaft orientation (library 1.2.0) ────────────────────────────────────
  # These are static problems: no inertia anywhere, so the answer is algebraic
  # and exact at t = 0. A handful of communication points is all the comparison
  # needs -- nothing here has a transient to resolve.
  - name: CantileverGravityDirection
    enabled: true
    model: RotorDynamics.TestModels.CantileverGravityDirection
    start_time: 0.0
    final_time: 0.01
    ncp: 5
    rtol: 1.0e-9
    # Gravity along -x: the orientation that loads the index-1 gravity terms,
    # which are identically zero in every other case in this file because they
    # all run with the default -y gravity.
    modifiers:
      phi_g: 3.141592653589793
    variables: [time, "rTip.r_out*", "phiTip.phi_out*", "r_tip_exact*",
                "phi_tip_exact*", "err_r*", "err_phi*"]

  - name: VerticalShaftNoSag
    enabled: true
    model: RotorDynamics.TestModels.VerticalShaftNoSag
    start_time: 0.0
    final_time: 0.01
    ncp: 5
    rtol: 1.0e-9
    modifiers: {}
    variables: [time, "rTip.r_out*", "phiTip.phi_out*", r_tip_horizontal]

  - name: MixedAxisGravity
    enabled: true
    model: RotorDynamics.TestModels.MixedAxisGravity
    start_time: 0.0
    final_time: 0.01
    ncp: 5
    rtol: 1.0e-9
    modifiers: {}
    variables: [time, "rTipV.r_out*", "rTipH.r_out*", err_vertical,
                err_horizontal, r_tip_exact_horizontal]

  # ── MultiBody bridge (library 1.2.0) ─────────────────────────────────────
  - name: MultiBodyMountEquivalence
    enabled: true
    model: RotorDynamics.TestModels.MultiBodyMountEquivalence
    start_time: 0.0
    final_time: 0.01
    ncp: 5
    rtol: 1.0e-9
    modifiers: {}
    variables: [time, "rTipA.r_out*", "rTipB.r_out*", "d_r*", "d_f*",
                "bearingA.support.f*", "bearingB.support.f*"]

  - name: MultiBodyMountKinematics
    enabled: true
    model: RotorDynamics.TestModels.MultiBodyMountKinematics
    start_time: 0.0
    final_time: 0.01
    ncp: 5
    rtol: 1.0e-9
    modifiers: {}
    variables: [time, "mount.support.r*", "mount.support.phi*", dx, dy, tilt_x,
                "err_r*", "err_phi*"]

  - name: MultiBodyMountReaction
    enabled: true
    model: RotorDynamics.TestModels.MultiBodyMountReaction
    start_time: 0.0
    final_time: 0.01
    ncp: 200
    rtol: 1.0e-9
    # Unlike the other new cases this one is not static: the pedestal is a
    # first-order spring-damper with tau = d/c = 1 ms, so the run has a decay
    # to resolve and needs more than a handful of points.
    modifiers: {}
    variables: [time, "rTipA.r_out*", "rTipB.r_out*", "d_r*", d_sup,
                "bearingA.support.r*", "bearingB.support.r*",
                "bearingA.support.f*", "bearingB.support.f*"]

  # ── Wrapper-subclass pattern + InitMode (library 1.3.0) ──────────────────
  - name: BrakeDemo
    enabled: true
    model: RotorDynamics.Examples.RotationalExamples.BrakeDemo
    start_time: 0.0
    final_time: 0.01
    ncp: 2000
    rtol: 1.0e-9
    modifiers: {}
    variables: [time, omegaSensor.w, t_stop, tau_brake]

  - name: RotorInitModes
    enabled: true
    model: RotorDynamics.TestModels.RotorInitModes
    start_time: 0.0
    final_time: 0.05
    ncp: 5
    rtol: 1.0e-9
    modifiers: {}
    variables: [time, wSpeed.w, wRest.w, omega_test]

  - name: InhomogeneousRotorInitModes
    enabled: true
    model: RotorDynamics.TestModels.InhomogeneousRotorInitModes
    start_time: 0.0
    final_time: 0.05
    ncp: 5
    rtol: 1.0e-9
    modifiers: {}
    variables: [time, wSpeed.w, wRest.w, omega_test]

  # ── Axial (thrust) DOF and beam-column stiffening (library 1.3.0) ────────
  - name: VerticalShaftThrustPath
    enabled: true
    model: RotorDynamics.TestModels.VerticalShaftThrustPath
    start_time: 0.0
    final_time: 0.01
    ncp: 5
    rtol: 1.0e-9
    modifiers: {}
    variables: [time, "thrust.axialFlange.f", F_expected,
                "shaft.axialFlange_a.f", "shaft.axialFlange_b.f",
                "rotor.axialFlange_a.f", "rotor.axialFlange_b.f",
                "rotor.r_c*", "shaft.flange_b.r*"]

  - name: VerticalThrustChain
    enabled: true
    model: RotorDynamics.TestModels.VerticalThrustChain
    start_time: 0.0
    final_time: 0.01
    ncp: 5
    rtol: 1.0e-9
    modifiers: {}
    variables: [time, "mount.axialFlange.f", F_expected]

  - name: VerticalHousingReaction
    enabled: true
    model: RotorDynamics.TestModels.VerticalHousingReaction
    start_time: 0.0
    final_time: 0.01
    ncp: 5
    rtol: 1.0e-9
    modifiers: {}
    variables: [time, "thrust.axialFlange.f", "bearingB.axialFlange_a.f", F_expected, d_F]

  - name: MomentLeverArm
    enabled: true
    model: RotorDynamics.TestModels.MomentLeverArm
    start_time: 0.0
    final_time: 0.01
    ncp: 5
    rtol: 1.0e-9
    modifiers: {}
    variables: [time, "bearing1.support.t*", M_expected, d_lever]

  - name: EccentricBrakeCoupling
    enabled: true
    model: RotorDynamics.TestModels.EccentricBrakeCoupling
    start_time: 0.0
    # Deliberately stops well BEFORE the disc does (t_stop with the coupling
    # correction is ~0.00355 s): ending mid-deceleration means omegaSensor.w
    # is genuinely still falling at the endpoint, so the check is sensitive
    # to the coupling term (I_eff vs I_p). Ending after the disc has already
    # stopped would make omega settle to exactly 0 either way, regardless of
    # which inertia the coupling actually used -- a regression that silently
    # dropped the coupling term would still pass.
    final_time: 0.0016
    ncp: 2000
    rtol: 1.0e-9
    modifiers: {}
    variables: [time, omegaSensor.w, t_probe, omega_naive, omega_coupled]

  - name: PlainBearingFriction
    enabled: true
    model: RotorDynamics.TestModels.PlainBearingFriction
    start_time: 0.0
    # t_probe (10% of the Coulomb-torque stopping time) is ~0.82 s with the
    # default parameters; ending at 0.9 s includes it while stopping well
    # before the disc does (full stop ~9.8 s), keeping the check sensitive
    # to the friction torque rather than settling to a trivial omega=0.
    final_time: 0.9
    ncp: 1000
    rtol: 1.0e-9
    modifiers: {}
    # bearing.support.f* added when PlainBearing gained the shared PartialBearingFriction
    # lever-arm reaction (support.f = -F_sd + F_fricSupport); reference regenerated fresh.
    variables: [time, omegaSensor.w, t_probe, omega_expected, "bearing.tau_fric", tau_fric_exact,
                "bearing.support.f*"]

  - name: HydrodynamicBearingIsotropyCheck
    enabled: true
    model: RotorDynamics.TestModels.HydrodynamicBearingIsotropyCheck
    start_time: 0.0
    final_time: 0.05
    ncp: 1000
    rtol: 1.0e-9
    # useFriction explicitly false on bearing2/bearing3 in the model itself now (see its
    # own documentation) -- HydrodynamicBearing defaults useFriction=true, which would
    # otherwise break the isotropic bit-for-bit match against RollerBearing's own
    # useFriction=false default. Reference regenerated fresh regardless.
    modifiers: {}
    variables: [time, "d_isotropic*", "r2.r_out*", "r3.r_out*"]

  - name: RollerBearingFriction
    enabled: true
    model: RotorDynamics.TestModels.RollerBearingFriction
    start_time: 0.0
    # t_probe (10% of the Coulomb-torque stopping time, with the test's own
    # deliberately-larger mu_roll = 0.05) is ~1.96 s; ending at 5 s includes it with
    # margin while staying well clear of the ~19.6 s stopping time and the omega-sign-
    # crossing chatter that follows it, which would make a bad regression signal.
    final_time: 5.0
    ncp: 2000
    rtol: 1.0e-9
    modifiers: {}
    variables: [time, omegaSensor.w, t_probe, omega_expected, "bearing.tau_fric",
                tau_fric_exact, "bearing.support.f*"]

  - name: HydrodynamicBearingFriction
    enabled: true
    model: RotorDynamics.TestModels.HydrodynamicBearingFriction
    start_time: 0.0
    # Petroff friction is load-independent and the closed form is a pure exponential
    # decay (never crosses zero), so unlike the Coulomb-friction cases there is no
    # stopping-time chatter to avoid; t_probe (one time constant) is ~4.29 s with the
    # default parameters, comfortably inside this window.
    final_time: 13.0
    ncp: 2000
    rtol: 1.0e-9
    modifiers: {}
    variables: [time, omegaSensor.w, t_probe, omega_expected, "bearing.tau_fric",
                "bearing.lossPower", "bearing.support.f*"]

  - name: HydrodynamicBearingShortBearing
    enabled: true
    model: RotorDynamics.TestModels.HydrodynamicBearingShortBearing
    start_time: 0.0
    # Same exponential-decay structure as HydrodynamicBearingFriction, but with the
    # eccentricity-corrected coefficient C_fric (~1.25x the plain-Petroff C at this
    # case's epsilon ~ 0.6): tau_time is correspondingly ~3.4 s rather than ~4.29 s.
    # 15.0 keeps ample margin over 3*tau_time either way.
    final_time: 15.0
    ncp: 3000
    rtol: 1.0e-9
    modifiers: {}
    variables: [time, bearing.epsilon, W_load_check, W_load,
                Kxx_expected, Kyy_expected, Kyx_expected, Kxy_expected,
                Cxx_expected, Cyy_expected, Cxy_expected,
                bearing.Kxx, bearing.Kyy, bearing.Kyx, bearing.Kxy,
                bearing.Cxx, bearing.Cyy, bearing.Cxy, bearing.Cyx,
                omegaSensor.w, t_probe, omega_expected, "bearing.tau_fric",
                tau_fric_expected, "bearing.support.f*", "F_fricSupport_expected*"]

  - name: HousingAccelerationCheck
    enabled: true
    model: RotorDynamics.TestModels.HousingAccelerationCheck
    start_time: 0.0
    # Same outer-ring fault parameterization (and t_c scale) as BearingFaultDemo, on the
    # same 0.05 s span -- same ncp for the same reason (>=10 stored points across the
    # shortest contact pulse, regression-testing skill section 2 tier 3).
    final_time: 0.05
    ncp: 50000
    rtol: 1.0e-9
    # Re-baselined after shaft1/shaft2 changed from FlexibleShaft to InertialFlexibleShaft
    # (2026-08-21): the shaft now carries real dynamic mass, so aSensor.a_out shows a genuine
    # impulsive response at each fault event (order 1e2-1e3 m/s2) instead of reading exactly
    # zero throughout -- see HousingAccelerationCheck's and InertialFlexibleShaft's own
    # documentation for why the old (FlexibleShaft-only) version of this rig structurally
    # could not show a response at all. tolerance/integral_tolerance re-verified empirically
    # against the new reference, not just carried over from the old topology.
    tolerance: 0.03
    # aSensor.a_out is a brief impulsive spike on a near-zero baseline; between fault impacts
    # the system now genuinely oscillates (real mass, no damping in the bending path -- see
    # InertialFlexibleShaftCheck's own documentation) rather than settling flat, so this may no
    # longer auto-classify as steady_state the way it did with the old massless shaft. Forced
    # to integral-of-absolute-error regardless (regression-testing skill section 4): the
    # quantity that actually matters is the impact response, not whichever single instant the
    # auto-classifier's tail window happens to land on.
    integral_abs_variables: ["aSensor.a_out*"]
    # integral_tolerance is a SEPARATE key from tolerance (funnel/steady_state) -- left unset
    # it silently falls back to the file's global 0.001. Matched to this case's own tolerance;
    # re-verify against the new reference before trusting (see comment above).
    integral_tolerance: 0.03
    modifiers: {}
    variables: [time, "aSensor.a_out*", "rSensor.r_out*", bearing.contact, bearing.f_imp,
                bearing.T_imp, bearing.v_impact, bearing.F_n, bearing.t_c, bearing.q_load,
                "bearing.F_imp*", "bearing.F_sd*", "housing.flange.r*"]

  - name: InertialFlexibleShaftCheck
    enabled: true
    model: RotorDynamics.TestModels.InertialFlexibleShaftCheck
    start_time: 0.0
    # StopTime spans ~25 periods of the (undamped) fundamental mode -- see the model's own
    # Documentation for why a single-instant comparison is the wrong check for this component
    # (it oscillates forever around its static equilibrium, never settling) and why int_r2
    # (a running time-integral) is tracked instead of the raw position.
    final_time: 0.1
    ncp: 5000
    rtol: 1.0e-9
    modifiers: {}
    variables: [time, int_r2, u_tip_expected, "rTip.r_out*"]

# ---------------------------------------------------------------------------------------
# Gear meshing (GearMeshPlan.md Phases A-E), locating bearings (Phase F) and axial inertia
# (AxialInertiaPlan.md). Added 2026-08-31.
#
# POLICY, for future work as much as for these: every model added under
# RotorDynamics/TestModels or RotorDynamics/Examples gets a case here as part of the same
# change that adds it. A model verified once in the credibility report is verified against
# the physics; a case here is what keeps it verified against the NEXT edit. The two are not
# substitutes -- the report re-derives closed forms, this file freezes trajectories.
#
# Each case below is sized from the model's own experiment(...) annotation, reduced in ncp
# where that annotation's grid exists for closed-form/FFT work the funnel comparison does not
# need (regression-testing skill section 2). `variables:` is lifted from the matching
# verify_* filter list in rotordynamics_validation.py.
#
# NO err_* VARIABLES, deliberately. The report's models expose `err_<quantity>` diagnostics --
# simulated minus closed form, relative -- whose value is ~1e-11, i.e. a numerical zero. A
# regression check on one of those asks "does this zero reproduce to within 0.1% of zero";
# the harness floors the band at 1e-9 absolute, so any solver difference at all fails it.
# Measured on GearMeshRatioCheck: err_delta/err_tau1/err_omega2 were the last three failures
# after everything else passed. They carry no information the raw quantities in the same case
# do not carry better, and checking a model against its own closed form is the REPORT's job.
# Residual variables that are STRUCTURALLY exact zeros (F_float, F_residual, F_axialResidual,
# F_weightResidual) are kept -- an exact zero reproduces as an exact zero.
#
# TOLERANCES BELOW ARE PROVISIONAL on every case except GearMeshRatioCheck, which is the only
# one whose reference has been stored and re-run so far. Expect the excitation-heavy cases
# (GearMeshExcitationCheck, GearboxToothFaultDemo, TwoStageGearboxDemo,
# GearMeshRippleTorqueCheck, AngularContactFaultFrequencyCheck) to need empirical tuning
# against their own stored references at rtol_factor 100 -- see HousingAccelerationCheck
# above for what that treatment looks like on an impulsive signal.
# ---------------------------------------------------------------------------------------

  # ---- GearMesh Phase A: closed-form load path ----
  - name: GearMeshRatioCheck
    enabled: true
    model: RotorDynamics.TestModels.GearMeshRatioCheck
    start_time: 0.0
    # No excitation at all (stiffnessVariation = Constant, every transmission-error amplitude
    # zero) and both axes rigidly pinned: a smooth ramp to a settled load path, so a quarter
    # of the annotation's grid resolves everything the comparison sees.
    final_time: 0.2
    ncp: 2000
    # rtol is 1e-10, two decades tighter than the model's own experiment annotation, so that
    # run_regression()'s 100x-looser re-simulation still lands at the 1e-8 this model actually
    # needs. That is not padding: gearMesh.delta is a CANCELLATION of two large rotating
    # terms (r_b1*theta1 + r_b2*theta2, each ~0.75 m at t = 0.2 s) whose difference is 4.4
    # MICRONS, so its accuracy is set by the ABSOLUTE error in the shaft angles, not by any
    # relative tolerance on delta itself. Every force in this case is proportional to delta,
    # so they all inherit it. Measured: at rtol 1e-6 the settled forces are 0.33% off and
    # nine checks fail; at 1e-8 every check is exactly 0.0. Loosening `tolerance` instead
    # would have hidden a real solver requirement behind a wider band.
    rtol: 1.0e-10
    modifiers: {}
    variables: [time, tau_load, omega1, gearMesh.z1, gearMesh.z2, gearMesh.m_n,
                gearMesh.phi_n, gearMesh.beta, gearMesh.phi_t, gearMesh.m_t,
                gearMesh.r_p1, gearMesh.r_p2, gearMesh.r_b1, gearMesh.r_b2,
                gearMesh.a_centre, gearMesh.eps_alpha, gearMesh.k_mesh,
                gearMesh.c_mesh_used, gearMesh.i_ratio, gearMesh.delta,
                gearMesh.F_loa, gearMesh.F_tang, gearMesh.F_sep,
                gearMesh.tau_1, gearMesh.tau_2, gear1.omega, gear2.omega]

  # ---- Planetary Phase G1: INTERNAL (ring) mesh, closed-form load path ----
  - name: GearMeshInternalRatioCheck
    enabled: true
    model: RotorDynamics.TestModels.GearMeshInternalRatioCheck
    start_time: 0.0
    # Same shape of run as GearMeshRatioCheck above: no excitation, both axes rigidly pinned,
    # a smooth ramp to a settled load path. 2000 points over 0.2 s is a quarter of the
    # annotation's grid and still resolves the 1950 Hz mesh ringdown envelope, which is what
    # the comparison actually has to reproduce.
    final_time: 0.2
    ncp: 2000
    # 1e-10, for exactly the reason GearMeshRatioCheck carries it: gearMesh.delta is a 5.9 um
    # cancellation of r_b1*theta1 - r_b2*theta2, each ~0.8 m by t = 0.2 s, so its accuracy is
    # set by the ABSOLUTE error in the shaft angles and every force in the case inherits that.
    # The internal mesh makes this slightly worse than the external one, not better: the two
    # cancelling terms are subtracted rather than added, and the ring's larger inertia stretches
    # the ringdown envelope from 3.9 ms to 4.8 ms.
    rtol: 1.0e-10
    modifiers: {}
    # s_int, a_centre, r_a2 and eps_alpha are the four DERIVED parameters the internal branch
    # computes differently; F_1[1] is the separating-force direction, the one qualitative sign
    # that distinguishes an internal mesh from an external one at run time. Freezing all five
    # is the point of this case -- the rest of the list mirrors GearMeshRatioCheck's so the two
    # references can be diffed against each other.
    variables: [time, tau_load, omega1, gearMesh.z1, gearMesh.z2, gearMesh.m_n,
                gearMesh.phi_n, gearMesh.beta, gearMesh.phi_t, gearMesh.m_t,
                gearMesh.s_int, gearMesh.r_p1, gearMesh.r_p2, gearMesh.r_b1, gearMesh.r_b2,
                gearMesh.r_a1, gearMesh.r_a2,
                gearMesh.a_centre, gearMesh.eps_alpha, gearMesh.k_mesh,
                gearMesh.c_mesh_used, gearMesh.m_eq, gearMesh.i_ratio, gearMesh.delta,
                gearMesh.F_loa, gearMesh.F_tang, gearMesh.F_sep,
                # Trailing * , NOT F_1[1]: these patterns are Impact result-filter GLOBS, in
                # which [1] is a character class and would silently match nothing.
                gearMesh.F_1*, gearMesh.F_2*,
                gearMesh.tau_1, gearMesh.tau_2, gearMesh.f_mesh,
                gear1.omega, gear2.omega]

  # ---- Planetary Phase G2: the ORBITING mesh point, by exact invariance ----
  - name: GearMeshOrbitInvarianceCheck
    enabled: true
    # Near-zero invariance residuals: their true value is 0, so the 100x
    # REGRESSION_RTOL_FACTOR re-simulation swamps them with solver noise and they
    # FAIL every run at |err| ~ 1e-9..1e-6 while relative error stays <= 1e-6.
    # Excluded 2026-09-02 so the routine suite stops re-diagnosing them.
    exclude_variables:
      - d_F1x
      - d_F1y
      - d_Floa
      - d_kt
      - d_omega2
      - d_tau1
      - d_tau2
    model: RotorDynamics.TestModels.GearMeshOrbitInvarianceCheck
    start_time: 0.0
    final_time: 0.2
    # 8000 points: this case's signals are NOT smooth settled values. Both rigs run the
    # stiffness variation, the transmission error and a damage envelope, so k_t and e_ste
    # carry tooth-mesh-rate content at 500 Hz and its 5 harmonics. A quarter of the
    # annotation's grid still resolves the 5th harmonic at 3.2 samples per cycle, which is
    # enough for a trajectory comparison (it is not an FFT).
    ncp: 8000
    # 1e-10 for GearMeshRatioCheck's reason -- delta is a micron-scale cancellation of two
    # ~0.75 m rotating terms -- but ALSO because the quantities frozen here are DIFFERENCES
    # between two rigs that are analytically identical. Their reference values are exact
    # zeros to within solver noise, so the reference is only meaningful if that noise is
    # itself small and reproducible.
    rtol: 1.0e-10
    # skip_initial_fraction 0.005 (1 ms): gearMeshA.F_1[1] is a fixed-frame force that
    # swings through zero every mesh orbit -- initial engagement at t~875us is a near-
    # vertical 0 -> -1462 N transition in ~25us, and a microsecond-scale solver-path
    # difference there produces a large point-wise excess even though every OTHER point
    # (8826 of 8827, measured) agrees to sub-0.1%. See GearMesh.mo's F_1 documentation and
    # the regression-testing skill's note on startup-edge sensitivity.
    skip_initial_fraction: 5.0e-3
    modifiers: {}
    # The d_* columns are the test: every one of them is an exact zero, and an exact zero
    # reproduces as an exact zero. err_theta_m is the one channel subtraction cannot see.
    variables: [time, psi_c, omega1, tau_load,
                d_delta, d_kt, d_este, d_env1, d_env2, d_Floa,
                d_F1x, d_F1y, d_tau1, d_tau2, d_omega2,
                err_theta_m, phi_F1,
                gearMeshA.theta_m, gearMeshB.theta_m,
                gearMeshA.delta, gearMeshA.k_t, gearMeshA.e_ste, gearMeshA.F_1*]

  # ---- Planetary Phase G3: CarrierPost, against a closed-form orbiting mass ----
  - name: CarrierPostCheck
    enabled: true
    # Near-zero invariance residuals: their true value is 0, so the 100x
    # REGRESSION_RTOL_FACTOR re-simulation swamps them with solver noise and they
    # FAIL every run at |err| ~ 1e-9..1e-6 while relative error stays <= 1e-6.
    # Excluded 2026-09-02 so the routine suite stops re-diagnosing them.
    exclude_variables:
      - err_Frad1
      - err_Ftan1
      - err_R1
      - err_R2
      - err_lag1
    model: RotorDynamics.TestModels.CarrierPostCheck
    start_time: 0.0
    final_time: 0.5
    # 5000 points over 0.5 s. Everything read here is either a ramp quantity or a settled
    # constant; the fastest thing present is the 477 Hz carrier support mode, which is a
    # startup transient only.
    ncp: 5000
    # 1e-10 is a REQUIREMENT here, not padding: post1.F_tang is 1.8 N obtained as the cross
    # product of a 0.099 m lever with a 2145 N force, i.e. a 1e-3 cancellation, and it is the
    # row that discriminates a post transmitting load from one transmitting only force.
    rtol: 1.0e-10
    modifiers: {}
    variables: [time, a_c, k_t, c_t, dr_pin2, dpsi_pin2, omega_c, alpha_c, m_p, gain,
                phi_lag, R1_target, R2_target, Frad1_target, Ftan1_target,
                tau_ramp1_target, tau_ramp2_target,
                R1, R2, lag1, lag2, eps_qs,
                err_R1, err_R2, err_Frad1, err_Ftan1, err_lag1,
                err_tauRamp1, err_tauRamp2, err_a2, err_psi2,
                post1.F_radial, post1.F_tang, post1.tau_post, post1.psi,
                post2.F_radial, post2.F_tang, post2.tau_post, post2.psi, post2.a_eff,
                planet1.r_c*, planet2.r_c*]

  # ---- Planetary Phase G4: the complete stage ----
  - name: PlanetaryRatioCheck
    # RE-ENABLED 2026-09-01: the stall referred to below was resolved and the model is now
    # verified (PlanetaryGearboxPlan.md 4.10). It was never a solver problem -- three
    # independent model defects (fixed-frame delta in GearMesh, an unanchored carrier angle,
    # and a wrong absoluteLateral default), plus a fourth found later, conflating theta_m
    # with theta1_ref. With those fixed the run went from 1 449 239 steps for 0.02 s to
    # 9 372 steps for 0.06 s, and error-test failures from 31 779 to 52.
    enabled: true
    # Near-zero invariance residuals: their true value is 0, so the 100x
    # REGRESSION_RTOL_FACTOR re-simulation swamps them with solver noise and they
    # FAIL every run at |err| ~ 1e-9..1e-6 while relative error stays <= 1e-6.
    # Excluded 2026-09-02 so the routine suite stops re-diagnosing them.
    exclude_variables:
      - err_F_rp
      - err_F_sp
      - err_delta_rp
      - err_delta_sp
      - err_f_mesh_rp
      - err_f_mesh_sp
      - err_omega_c
      - err_tau_carrier
      - err_tau_ring
    model: RotorDynamics.TestModels.PlanetaryRatioCheck
    start_time: 0.0
    final_time: 0.06
    # 3000 points over 0.06 s. Excitation is OFF in this case (Constant stiffness, no
    # transmission error), so there is no tooth-mesh content to resolve -- only the 0.02 s
    # ramp and the 6.5 kHz mesh-mode ringdown that decays with a 0.44 ms envelope. The
    # horizon is cut to exactly what the answer needs: see the rtol note below for why it
    # cannot be bought back with a looser tolerance instead.
    ncp: 3000
    # A HEAVY CASE: 8 GearMesh instances, 4 CarrierPosts, 11 bearings and a 6.5 kHz stiff
    # mode. It earns its cost -- it is the only case where the internal mesh, the orbiting
    # mesh point and CarrierPost all have to agree at once. NOTE the "tens of minutes per
    # run" warning that stood here until 2026-09-01 was a symptom of the four model defects,
    # not of the model's size: after they were fixed the solve went from 1 449 239 steps for
    # 0.02 s to 9 372 steps for the full 0.06 s. Cost is now unremarkable.
    rtol: 1.0e-9
    modifiers: {}
    variables: [time, N, z_s, z_p, z_r, m_n, phi_n, b_face, k_sp, k_rp, tau_load, omega_s,
                a_c, r_ps, r_pp, r_pr, r_bs, ratio,
                omega_c_t, omega_p_t, f_mesh_t, F_sp_t, F_rp_t,
                delta_sp_t, delta_rp_t, tau_ring_t,
                err_omega_c, err_omega_p, err_f_mesh_sp, err_f_mesh_rp,
                err_F_sp, err_F_rp, err_delta_sp, err_delta_rp,
                err_tau_ring, err_tau_carrier,
                loadShareSpread, F_sp_mean, F_sp_max, F_sp_min,
                carrier.omega, sun.omega]

  # ---- Planetary Phase G5: mesh phasing and harmonic cancellation ----
  - name: PlanetaryMeshPhasingCheck
    # RE-ENABLED 2026-09-01: see PlanetaryRatioCheck above -- same model family, and the same
    # four defects. Verified the same day.
    enabled: true
    model: RotorDynamics.TestModels.PlanetaryMeshPhasingCheck
    start_time: 0.0
    final_time: 0.12
    # 12000 points = 130 samples per mesh cycle at 768 Hz, 26 per 5th-harmonic cycle. The
    # credibility report FFTs k_sum_sp and F_sun_x over an integer number of mesh cycles to
    # read the harmonic amplitudes, and the cancelling harmonics have to come out at 1e-12
    # of the surviving one -- so this is one of the few cases whose ncp is set by SPECTRAL
    # content rather than by trajectory shape.
    ncp: 12000
    rtol: 1.0e-9
    modifiers: {}
    # gamma_s/gamma_r are the phasing result and are exact constants; k_sum_sp and F_sun_x
    # are the signals whose harmonic content the report reads. Freezing both means a future
    # edit that broke the cancellation would fail here even if nobody re-ran the FFT.
    variables: [time, N, z_s, z_p, z_r, a_c, ratio, f_mesh_t, F_sp_t, omega_c_t,
                gamma_s*, gamma_r*, err_gamma_s*, err_gamma_r*,
                k_sum_sp, k_sum_rp, F_sum_sp, tau_sun, F_sun_x, F_sun_y,
                err_F_sp, err_omega_c, err_f_mesh, loadShareSpread]

  # ---- Planetary Phase G8: the flexible ring rim (FlexibleRing) ----
  # Four cases, added 2026-09-01 with the phase. G8a and G8b are cheap and check the
  # component in isolation; G8c and G8d check it assembled under a planetary stage. The pair
  # G8a/G8b is deliberate: mode frequencies depend only on K_n/M_n and apply NO LOAD at all,
  # so a wrong generalized-force projection passes G8a untouched. G8b is what exercises it.

  - name: RingModeFrequencyCheck
    # G8a: pluck a free ring and read back its in-plane flexural frequencies, against Love's
    # closed form f_n = n(n^2-1)/(2*pi*sqrt(n^2+1)) * sqrt(EI/(rho*A*R^4)). Frequencies are
    # measured from zero-crossing times, so ncp has to resolve the HIGHEST retained mode:
    # 3077 Hz at these dimensions, and 20000 points over 0.05 s gives 130 samples per cycle
    # of it. b_leak is frozen alongside f_meas because it is the independent check that the
    # modes are uncoupled -- a sin-family amplitude that stops being zero means the ring's
    # modal basis has been broken, which a frequency check alone would not catch.
    enabled: true
    model: RotorDynamics.TestModels.RingModeFrequencyCheck
    start_time: 0.0
    final_time: 0.05
    ncp: 20000
    rtol: 1.0e-9
    modifiers: {}
    # NO err_f* and NO b_leak*: both are computed near-zeros, and a stored 1e-11 cannot be
    # reproduced to 0.1% OF ITSELF -- see the regression-testing skill section 11.2. The
    # measured frequencies f_meas* carry the same information, well-conditioned: if a mode
    # frequency drifts, f_meas* moves and this case fails. The closed-form comparison is the
    # credibility report's job, not the suite's.
    variables: [time, R, b_rim, h_rim, rho, E, amp_0, f_t*, f_meas*, ring.a*]

  - name: RingStaticDeflectionCheck
    # G8b: two inward pinch loads 180 degrees apart, against the handbook thin-ring
    # deflection (pi/4 - 2/pi)*P*R^3/(E*I). This is the case that exercises the generalized-
    # force projection, so it is the one that would catch a wrong one. Two truncation
    # controls are frozen with it: dD_trunc (the same series cut to the retained modes, which
    # is what the model can actually reach) and oddLeak/sinLeak, which must stay at zero
    # because a symmetric pinch cannot drive odd orders or the sin family. NOTE oddLeak
    # indexes a[2*j] -- mode n is stored at index n-1, so ODD orders sit at EVEN indices; an
    # earlier a[2*j-1] returned half the measured deflection instead of zero.
    # Quasi-static: 2000 points over 0.05 s is ample for a load ramp with no oscillation.
    enabled: true
    model: RotorDynamics.TestModels.RingStaticDeflectionCheck
    start_time: 0.0
    final_time: 0.05
    ncp: 2000
    rtol: 1.0e-9
    modifiers: {}
    # err_trunc/err_exact/oddLeak/sinLeak all dropped: computed near-zeros again (11.2).
    # dD_meas stays even though it IS a difference of two deflections, because it is this
    # model's whole output and there is nothing better conditioned to put in its place; the
    # modal amplitudes ring.a* are added alongside it as the well-conditioned quantities the
    # deflection is built from, so a drift shows up in them first.
    variables: [time, R, b_rim, h_rim, P, S_trunc, dD_meas, dD_trunc, dD_exact, ring.a*]

  - name: PlanetaryFlexibleRingCheck
    # G8c: the assembled stage on a COMPLIANT rim, and the sharpest available test that the
    # mesh cannot create energy. N equally spaced in-phase planets can drive ring order n
    # only when n is a multiple of N, because sum_i cos(n*psi_i) is N*cos(n*theta_c) for
    # n = 0 (mod N) and IDENTICALLY ZERO otherwise -- so with modes n = 2..5 and four
    # planets, only n = 4 may respond. Nothing in the model is told this. ringReject is the
    # headline and the reason this case earns its cost: the forbidden orders are UNFORCED, so
    # anything appearing in them arrived from somewhere it should not have. Against the
    # earlier bilateral-spring mesh they grew out of round-off at +4710 1/s; against the
    # unilateral contact they decay at -44.8 1/s.
    enabled: true
    model: RotorDynamics.TestModels.PlanetaryFlexibleRingCheck
    start_time: 0.0
    final_time: 0.06
    ncp: 6000
    rtol: 1.0e-9
    modifiers: {}
    # ringFiltered and ringReject are the HEADLINE physics of this case but are exactly the
    # kind of computed near-zero (1e-15 and 1e-10) that a stored-trajectory check cannot
    # reproduce -- they belong to the credibility report, which compares them against zero
    # with a physically meaningful threshold. What the suite freezes instead is ringDriven
    # (the order that DOES respond, ~4e-6) plus the mesh forces and the contact state: if the
    # spatial filtering ever broke, ringDriven and the forces move too.
    variables: [time, N, z_s, z_p, z_r, h_rim, ratio, gearbox.ringFlex.f_n*,
                ringDriven, ringQuasiStatic,
                F_sp_mean, F_sp_t, loadShareSpread,
                gearbox.meshSP*.sigma, gearbox.meshRP*.sigma,
                gearbox.carrier.omega, gearbox.planet*.omega]

  # ---- G6's demo: the whole stage as one component, with a ring accelerometer ----
  # Paired with a floating-sun case. The pair is the answer to PlanetaryGearboxPlan.md
  # section 5 question 5: softening k_sun a thousandfold changes NOTHING here, because four
  # equally spaced, equally loaded, error-free meshes exert no net lateral force on the sun.
  # The two references should therefore agree to solver noise -- and that agreement is the
  # result, not a redundancy. sunOffset stays at 5e-16 m in both.
  - name: PlanetaryGearboxDemo
    enabled: true
    model: RotorDynamics.Examples.PlanetaryGearboxDemo
    start_time: 0.0
    final_time: 0.33
    ncp: 3000
    rtol: 1.0e-8
    modifiers: {}
    variables: [time, N, z_s, z_p, z_r, ratio, f_c_t, f_mesh_t, f_pass_t, h_rim, k_sun,
                F_sp*, F_rp*, F_sp_mean, F_sp_t, loadShare*,
                tau_out, err_ratio, err_tau, w_sensor, v_sensor, a_sensor, sunOffset]

  - name: PlanetaryGearboxDemo_FloatingSun
    enabled: true
    model: RotorDynamics.Examples.PlanetaryGearboxDemo
    start_time: 0.0
    final_time: 0.33
    ncp: 3000
    rtol: 1.0e-8
    modifiers:
      floatingSun: true
    variables: [time, N, z_s, z_p, z_r, ratio, f_c_t, f_mesh_t, f_pass_t, h_rim, k_sun,
                F_sp*, F_rp*, F_sp_mean, F_sp_t, loadShare*,
                tau_out, err_ratio, err_tau, w_sensor, v_sensor, a_sensor, sunOffset]

  # ---- G7: the FAULT MATRIX. Five cases on one rig, differing only in which fault is on. ----
  # Rates are timed off GearMesh's own damage ENVELOPE (env1/env2) rising edges -- exact, no
  # peak finding. NOTE env1/env2 are computed whenever THAT MESH's useFault is true regardless
  # of whether that gear's damage amplitudes are zero, so they are kinematic MARKERS: the
  # sun-fault case also returns T_planet and the ring-fault case also returns T_planetR, from
  # meshes carrying no damage. Read the n* counters to tell which fault is actually active.
  - name: PlanetaryFaultSignature_Healthy
    # The baseline every other case is a departure from: loadShareSpread 2.7e-10, no fault
    # events at all, err_F_sp mean -2.4e-5.
    enabled: true
    # Near-zero invariance residuals: their true value is 0, so the 100x
    # REGRESSION_RTOL_FACTOR re-simulation swamps them with solver noise and they
    # FAIL every run at |err| ~ 1e-9..1e-6 while relative error stays <= 1e-6.
    # Excluded 2026-09-02 so the routine suite stops re-diagnosing them.
    exclude_variables:
      - loadShareSpread
    model: RotorDynamics.TestModels.PlanetaryFaultSignatureCheck
    start_time: 0.0
    final_time: 0.45
    ncp: 4500
    rtol: 1.0e-8
    modifiers: {}
    variables: [time, N, z_s, z_p, z_r, f_c_t, f_mesh_t, f_sun_t, f_planet_t,
                T_sun_t, T_planet_t, T_ring_t,
                T_sun, T_planet, T_planetR, T_ring,
                err_T_sun, err_T_planet, err_T_planetR, err_T_ring,
                nSun, nPlanet, nPlanetR, nRing,
                envSun, envPlanet, envPlanetR, envRing,
                F_sp_mean, F_sp_t, loadShareSpread, loadShare1, err_F_sp]

  - name: PlanetaryFaultSignature_SunTooth
    # T_sun 62.857 ms against the closed-form 62.8571 (err 5.6e-14), 7 events, spread 0.041.
    # Exact because the sun is kinematically driven -- its rate is a boundary condition.
    enabled: true
    model: RotorDynamics.TestModels.PlanetaryFaultSignatureCheck
    start_time: 0.0
    final_time: 0.45
    ncp: 4500
    # rtol 1e-8 -> 1e-10 (2026-09-03): loadShare1 failed the routine 100x factor on a single
    # point (t~1.9us, the fault ratio's denominator-floor transition at the very start) --
    # see PlanetTooth's note below for the shared diagnosis and why tightening, not
    # skip_initial_fraction, is the fix that generalises across all three siblings.
    rtol: 1.0e-10
    modifiers:
      useSunFault: true
    variables: [time, N, z_s, z_p, z_r, f_c_t, f_mesh_t, f_sun_t, f_planet_t,
                T_sun_t, T_planet_t, T_ring_t,
                T_sun, T_planet, T_planetR, T_ring,
                err_T_sun, err_T_planet, err_T_planetR, err_T_ring,
                nSun, nPlanet, nPlanetR, nRing,
                envSun, envPlanet, envPlanetR, envRing,
                F_sp_mean, F_sp_t, loadShareSpread, loadShare1, err_F_sp]

  - name: PlanetaryFaultSignature_PlanetTooth
    # T_planet = T_planetR = 23.571 ms (err 4.4e-7) -- ONE tooth timed through TWO different
    # meshes, which is the evidence behind the factor of 2 in the planet-fault rate. Largest
    # disturbance of the three: spread 0.285, and loadShare1 reaches -0.25 as planet 1's sun
    # mesh unloads onto its coast flank. THIS CASE IS THE REGRESSION GUARD for the
    # meshSP.useFault defect fixed 2026-09-01, which made it report zero sun-mesh events.
    enabled: true
    model: RotorDynamics.TestModels.PlanetaryFaultSignatureCheck
    start_time: 0.0
    final_time: 0.45
    ncp: 4500
    # rtol 1e-8 -> 1e-10 (2026-09-03): loadShare1 failed the routine 100x factor at several
    # points clustered at its fault-tooth mesh transitions (t~2us, 0.199, 0.34, 0.388s) --
    # near-vertical edges (0 -> ~1 in a few us) whose event TIMING shifts slightly under a
    # looser rtol, not a value disagreement (skill 12d Pattern 2's mechanism, but recurring
    # through the run rather than only at the start, so skip_initial_fraction alone would not
    # have covered it). At rtol_factor 1 (this case's own rtol) the run is bit-identical to
    # the reference (0.0 error, skill 7) -- confirming the 100x factor, not the model, is what
    # moves these edges. Tightening two decades per 11.3's rule lands the 100x-loosened run
    # back at 1e-8 and cleared every point: 96/96 across all three siblings, verified live.
    rtol: 1.0e-10
    modifiers:
      usePlanetFault: true
    variables: [time, N, z_s, z_p, z_r, f_c_t, f_mesh_t, f_sun_t, f_planet_t,
                T_sun_t, T_planet_t, T_ring_t,
                T_sun, T_planet, T_planetR, T_ring,
                err_T_sun, err_T_planet, err_T_planetR, err_T_ring,
                nSun, nPlanet, nPlanetR, nRing,
                envSun, envPlanet, envPlanetR, envRing,
                F_sp_mean, F_sp_t, loadShareSpread, loadShare1, err_F_sp]

  - name: PlanetaryFaultSignature_RingTooth
    # T_ring 110.000 ms against 110.0000 (err 5.8e-14), 4 events, spread 0.017.
    enabled: true
    model: RotorDynamics.TestModels.PlanetaryFaultSignatureCheck
    start_time: 0.0
    final_time: 0.45
    ncp: 4500
    # rtol 1e-8 -> 1e-10 (2026-09-03): same single-point startup-edge failure and fix as
    # SunTooth/PlanetTooth above -- see PlanetTooth's note for the shared diagnosis.
    rtol: 1.0e-10
    modifiers:
      useRingFault: true
    variables: [time, N, z_s, z_p, z_r, f_c_t, f_mesh_t, f_sun_t, f_planet_t,
                T_sun_t, T_planet_t, T_ring_t,
                T_sun, T_planet, T_planetR, T_ring,
                err_T_sun, err_T_planet, err_T_planetR, err_T_ring,
                nSun, nPlanet, nPlanetR, nRing,
                envSun, envPlanet, envPlanetR, envRing,
                F_sp_mean, F_sp_t, loadShareSpread, loadShare1, err_F_sp]

  - name: PlanetaryFaultSignature_PinError
    # No repetition rate -- a static geometric offset. loadShareSpread 1.1e-4 against the
    # healthy 2.7e-10. Small in absolute terms because a planet is a floating idler that
    # re-centres; see the model documentation.
    enabled: true
    model: RotorDynamics.TestModels.PlanetaryFaultSignatureCheck
    start_time: 0.0
    final_time: 0.45
    ncp: 4500
    rtol: 1.0e-8
    modifiers:
      dr_pin1: 1.0e-6
    variables: [time, N, z_s, z_p, z_r, f_c_t, f_mesh_t, f_sun_t, f_planet_t,
                T_sun_t, T_planet_t, T_ring_t,
                T_sun, T_planet, T_planetR, T_ring,
                err_T_sun, err_T_planet, err_T_planetR, err_T_ring,
                nSun, nPlanet, nPlanetR, nRing,
                envSun, envPlanet, envPlanetR, envRing,
                F_sp_mean, F_sp_t, loadShareSpread, loadShare1, err_F_sp]
    # loadShareSpread: reference 3.418e-5, well above the 1e-9 floor (unlike the healthy
    # PlanetarySidebandCheck case above), so the ordinary tolerance*|ref| formula applies and
    # a modest override genuinely fixes this rather than papering over it. Needed: endpoint
    # error 4.44e-8 / ref 3.418e-5 = 1.3e-3; 5e-3 keeps ~4x margin.
    variable_tolerances:
      loadShareSpread: 5.0e-3

  # ---- G6: the SEQUENTIALLY-phased set, and the asymmetry the in-phase set cannot show ----
  # Paired with a stiff-rim control, exactly as PlanetarySidebandCheck is. The deliverable is
  # the ORDER SPECTRUM of w_sensor, which is post-processing and belongs to the credibility
  # report; what the suite freezes is the trajectory it is computed from, plus the load-path
  # errors and the three sequential mesh phases {0, 1/3, 2/3}. If the phasing ever broke,
  # err_gamma_r and loadShareSpread move before the spectrum does.
  # Horizon: 0.1 s settling + 8 carrier revolutions at f_c = 9.2172 Hz. Whole revolutions,
  # so a rectangular window puts every carrier order exactly on an FFT bin.
  - name: PlanetarySequentialSidebandCheck
    # TRIAGED 2026-09-04 (regression-testing skill 14): these four fail at the routine
    # --rtol-factor 100 and pass cleanly at --rtol-factor 1, so they are artifacts of the
    # check-run factor and not a trajectory difference. They are also exactly skill 11.2's
    # class -- deviations from a closed form whose reference values are numerical zeros
    # (1.7e-07..2.3e-06 measured), so the check asks a zero to reproduce to within a
    # fraction of zero and no tolerance makes that meaningful. The RAW quantities they are
    # residuals of (the mesh and shaft rates themselves) stay in variables: and are checked.
    # Pre-existing; unrelated to the Phase L/H1/H2 work landed the same day, which is
    # structurally dormant in this model (beta = 0, x1 = x2 = 0, useFriction = false).
    exclude_variables: [err_f_mesh_rp, err_f_mesh_sp, err_omega_c, err_omega_p]
    enabled: true
    # ringAmp[*] is an FFT amplitude at the noise floor: 6.5e-08 m here, and the
    # funnel excess is 6.3e-11 m -- 0.1% of the signal, i.e. FFT reproducibility,
    # not a discrepancy. 1e-2 is ~5x the 1.97e-3 needed to pass, and still catches
    # any real change in the order-129 sideband this case exists to measure.
    # NOTE the glob: 'ringAmp[4]' would be a CHARACTER CLASS matching 'ringAmp4'.
    variable_tolerances:
      "ringAmp*": 1.0e-2
      # loadShareSpread is an O(1) quantity (ptp 2.0), NOT a noise-floor one: it
      # passes at --rtol-factor 1 and misses by only 1.5x under the 100x routine
      # factor, which shifts a real trajectory by ~0.1% of its range. Needs
      # 1.54e-3/1.58e-3; 5e-3 keeps ~3x margin without loosening the other 29
      # checks in the case.
      "loadShareSpread": 5.0e-3
    # final_time 0.30 s, NOT the model's own 0.967945 s (2026-09-03): the model's own docs
    # require WHOLE CARRIER REVOLUTIONS so an FFT lands its lines on exact bins -- a spectral
    # requirement, not a settling-time one, and this case does NOT need it. That claim now has
    # its own separate home: val.verify_planetary_sequential_sidebands() in the credibility
    # notebook runs this SAME model independently at the full 0.967945 s / 23231-point
    # horizon and reproduces the documented order-120/123/129 measurement on its own (see
    # regression-testing skill 12c/12d, modelica-equation-modeling 20). This case only has to
    # freeze the trajectory: settling is documented at 0.1 s, the slowest significant content
    # afterward has a ~0.0375 s period, so 0.30 s clears 0.1 s + 5 cycles with margin.
    model: RotorDynamics.TestModels.PlanetarySequentialSidebandCheck
    start_time: 0.0
    final_time: 0.30
    ncp: 7200
    # 1e-8, not 1e-9, for the reason PlanetarySidebandCheck records: every err_* here is a
    # difference of nearly equal numbers, and holding one to a tight rtol makes the solver
    # chase digits the subtraction already destroyed.
    rtol: 1.0e-8
    modifiers: {}
    variables: [time, N, z_s, z_p, z_r, h_rim, ratio, f_c_t, f_mesh_t, gearbox.ringFlex.f_n*,
                w_sensor, ringAmp*, ringStatic,
                F_sp_mean, F_sp_t, loadShareSpread,
                err_omega_c, err_omega_p, err_f_mesh_sp, err_f_mesh_rp,
                err_F_sp, err_tau_carrier, err_gamma_r*]

  - name: PlanetarySequentialSidebandCheck_RigidRim
    # TRIAGED 2026-09-04 (regression-testing skill 14): these four fail at the routine
    # --rtol-factor 100 and pass cleanly at --rtol-factor 1, so they are artifacts of the
    # check-run factor and not a trajectory difference. They are also exactly skill 11.2's
    # class -- deviations from a closed form whose reference values are numerical zeros
    # (1.7e-07..2.3e-06 measured), so the check asks a zero to reproduce to within a
    # fraction of zero and no tolerance makes that meaningful. The RAW quantities they are
    # residuals of (the mesh and shaft rates themselves) stay in variables: and are checked.
    # Pre-existing; unrelated to the Phase L/H1/H2 work landed the same day, which is
    # structurally dormant in this model (beta = 0, x1 = x2 = 0, useFriction = false).
    exclude_variables: [err_f_mesh_rp, err_f_mesh_sp, err_omega_c, err_omega_p]
    enabled: true
    # Rigid-rim CONTROL: these ring modes are structurally suppressed, so the
    # amplitudes are 0.9-2.4 nm and the funnel excess is 49-65 pm. Needs 5.65e-2
    # to pass; 2e-1 keeps ~3.5x margin. The control's real assertion -- that the
    # amplitudes stay at the noise floor instead of growing ~46x to the flexible
    # case's 6.5e-08 m -- survives a 20% tolerance untouched, which is why this
    # is preferable to excluding the variables outright.
    # NOTE the glob: 'ringAmp[3]' would be a CHARACTER CLASS matching 'ringAmp3'.
    #
    # RAISED 2.0e-1 -> 4.0e-1 on 2026-09-04. ringAmp[4] failed a full-suite run by a funnel
    # excess of 3.99e-12 against a tube half-width of 1.77e-10 -- it missed by 2.3% OF THE
    # TUBE, i.e. the tolerance was sitting exactly on its own boundary (skill 11.5 sizing:
    # (atoly + err)/ptp = 0.205, against the 0.200 in force). Triaged before widening, not
    # instead of it: it is not a cancellation (skill 11.1) and not the wrong variable
    # (skill 12d), because it passes cleanly at --rtol-factor 1 -- it is the check-run
    # factor moving a sub-nanometre FFT amplitude by a few picometres. 4e-1 restores a 2x
    # margin, and the control's actual assertion is untouched: ringAmp[4] sits at
    # 8.84e-10 m here against 6.54e-08 m in the flexible-rim case, a factor of 74, so a 40%
    # band still cannot let a suppressed mode pass for an excited one.
    variable_tolerances:
      "ringAmp*": 4.0e-1
      # loadShareSpread is an O(1) quantity (ptp 2.0), NOT a noise-floor one: it
      # passes at --rtol-factor 1 and misses by only 1.5x under the 100x routine
      # factor, which shifts a real trajectory by ~0.1% of its range. Needs
      # 1.54e-3/1.58e-3; 5e-3 keeps ~3x margin without loosening the other 29
      # checks in the case.
      "loadShareSpread": 5.0e-3
    # final_time 0.30 s, NOT the model's own 0.967945 s (2026-09-03): the model's own docs
    # require WHOLE CARRIER REVOLUTIONS so an FFT lands its lines on exact bins -- a spectral
    # requirement, not a settling-time one, and this case does NOT need it. That claim now has
    # its own separate home: val.verify_planetary_sequential_sidebands() in the credibility
    # notebook runs this SAME model independently at the full 0.967945 s / 23231-point
    # horizon and reproduces the documented order-120/123/129 measurement on its own (see
    # regression-testing skill 12c/12d, modelica-equation-modeling 20). This case only has to
    # freeze the trajectory: settling is documented at 0.1 s, the slowest significant content
    # afterward has a ~0.0375 s period, so 0.30 s clears 0.1 s + 5 cycles with margin.
    model: RotorDynamics.TestModels.PlanetarySequentialSidebandCheck
    start_time: 0.0
    final_time: 0.30
    ncp: 7200
    rtol: 1.0e-8
    # The control: a 100 mm rim collapses all three sideband orders by ~46x while leaving the
    # SAME three orders as the only populated ones. Structure from phasing, amplitude from rim.
    modifiers:
      h_rim: 0.100
    variables: [time, N, z_s, z_p, z_r, h_rim, ratio, f_c_t, f_mesh_t, gearbox.ringFlex.f_n*,
                w_sensor, ringAmp*, ringStatic,
                F_sp_mean, F_sp_t, loadShareSpread,
                err_omega_c, err_omega_p, err_f_mesh_sp, err_f_mesh_rp,
                err_F_sp, err_tau_carrier, err_gamma_r*]

  - name: PlanetarySidebandCheck
    # G8d: modulation sidebands produced by a rim that bends instead of by an assumed
    # weighting window. THE HORIZON HERE IS DELIBERATELY SHORT. The credibility report runs
    # this model for eight carrier revolutions (0.91 s) because its claim is SPECTRAL and
    # needs the frequency resolution; a regression case does not -- freezing the trajectory
    # itself detects drift perfectly well, and 0.15 s costs about a sixth as much. The
    # spectral claim stays in the notebook, where it belongs, and this case guards the
    # trajectory that claim is read out of.
    #
    # h_rim = 0.020 is the model default and is NOT an arbitrary choice: at 0.008 the rim
    # deflects 52 um at the mesh stations against a 3.4 um tooth compression, carrying every
    # mesh back and forth across its flanks -- 9080 state events in 0.44 s, genuine repeated
    # contact loss. At 0.020 (deflection ~3.3 um) contact is never lost: 165 events over
    # 0.6 s, sigma = +1 at every sample. The sigma variables are frozen for exactly that
    # reason -- they are what would show the model drifting back into flank chatter.
    #
    # rtol 1.0e-8, not the 1e-9 used by the rest of this family: at 1e-9 the step size decays
    # from 0.10 to 0.0005 simulated seconds per wall second around t = 0.5 s. That looked
    # like an instability and was not one -- at 1e-8 the identical case is stationary to five
    # digits across every window and the spectrum is unchanged.
    enabled: true
    model: RotorDynamics.TestModels.PlanetarySidebandCheck
    start_time: 0.0
    final_time: 0.15
    # 7500 points = 50 kHz sampling, ~39 samples per tooth-mesh cycle at 1272.7 Hz, so the
    # mesh-frequency content the sidebands ride on is resolved in the frozen trajectory.
    ncp: 7500
    rtol: 1.0e-8
    modifiers: {}
    # w_sensor is the quantity the whole case exists for -- the rim deflection a fixed
    # accelerometer would see -- and it is well-conditioned (~4e-6 m, oscillating). The
    # err_*/ringFiltered/ringReject near-zeros are left to the credibility report (11.2).
    # gamma_s*/gamma_r* are kept: they are O(1) mesh phases that land on exact values
    # (0 or 0.5 for this set), not computed residuals.
    variables: [time, N, z_s, z_p, z_r, h_rim, ratio, gearbox.ringFlex.f_n*,
                w_sensor, ringDriven,
                gamma_s*, gamma_r*, F_sp_mean, F_sp_t, loadShareSpread,
                gearbox.meshSP*.sigma, gearbox.meshRP*.sigma,
                gearbox.carrier.omega]
    # loadShareSpread: healthy set, reference value 1.99e-10 -- BELOW ModCheck's hardcoded
    # steady_state floor (atol = max(tolerance*|ref|, 1e-9); 1e-9 dominates regardless of
    # tolerance, so no variable_tolerances value can pass this, checked against the actual
    # formula in steady_state.py before excluding). loadShareSpread stays checked and
    # meaningful on the FAULTED sibling cases (PlanetaryFaultSignature_*), where the healthy
    # near-zero floor is exactly the point of comparison.
    exclude_variables:
      - loadShareSpread

  # ---- GearMesh Phase C: helical thrust, sign and overturning moment ----
  - name: GearMeshHelicalThrustCheck
    enabled: true
    model: RotorDynamics.TestModels.GearMeshHelicalThrustCheck
    start_time: 0.0
    final_time: 0.2
    ncp: 2000
    # 1e-10, for exactly the reason GearMeshRatioCheck above carries it: every force here is
    # proportional to gearMesh.delta, a 4.4 um cancellation of two ~0.75 m rotating terms, so
    # the 100x-loosened re-simulation has to land on the 1e-8 this model needs rather than on
    # 1e-6. Measured at 1e-8: seven checks fail, the forces 0.31% out. At 1e-10: all pass.
    rtol: 1.0e-10
    modifiers: {}
    variables: [time, tau_load, gearMesh.z1, gearMesh.z2, gearMesh.m_n, gearMesh.phi_n,
                gearMesh.beta, gearMesh.phi_t, gearMesh.beta_b, gearMesh.m_t,
                gearMesh.r_p1, gearMesh.r_p2, gearMesh.r_b1, gearMesh.r_b2,
                gearMesh.eps_alpha, gearMesh.eps_beta, gearMesh.eps_gamma,
                gearMesh.F_loa, gearMesh.F_tang, gearMesh.F_ax1,
                "gearMesh.M_1*", "gearMesh.M_2*",
                thrust1.axialFlange.f, thrust2.axialFlange.f]

  # ---- The INTERNAL twin of the case above: PlanetaryGearboxPlan.md section 7 gap 1 ----
  - name: GearMeshInternalHelicalThrustCheck
    enabled: true
    model: RotorDynamics.TestModels.GearMeshInternalHelicalThrustCheck
    start_time: 0.0
    final_time: 0.5
    # 0.5 s, not the external twin's 0.2 s: this rig settles more slowly, and the point of
    # the case is three SIGNS plus three magnitudes read after the ring-down.
    ncp: 2000
    # Same 1e-10 as the external twin, for the same reason: every force is proportional to
    # gearMesh.delta, a 5.6 um cancellation of two large rotating terms.
    rtol: 1.0e-10
    modifiers: {}
    variables: [time, tau_load, gearMesh.z1, gearMesh.z2, gearMesh.m_n, gearMesh.phi_n,
                gearMesh.beta, gearMesh.phi_t, gearMesh.beta_b, gearMesh.m_t,
                gearMesh.r_p1, gearMesh.r_p2, gearMesh.r_b1, gearMesh.r_b2,
                gearMesh.a_centre, gearMesh.s_int,
                gearMesh.eps_alpha, gearMesh.eps_beta, gearMesh.eps_gamma,
                gearMesh.F_loa, gearMesh.F_tang, gearMesh.F_ax1,
                "gearMesh.M_1*", "gearMesh.M_2*",
                err_Fax, err_M1, err_M2, err_omega2,
                thrust1.axialFlange.f, thrust2.axialFlange.f]
    # err_Fax/err_M1/err_M2/err_omega2 are near-zero residuals (ref ~1e-8, endpoint_tolerance
    # floored at 1e-9) -- the model's own correctness assertions, comparing two numbers near
    # zero under the routine 100x looser re-simulation. Stored (still in `variables:` above,
    # for the credibility report and manual inspection) but excluded from comparison, per the
    # regression-testing skill section 11.2. F_ax1/M_1*/M_2* -- the O(1) quantities these
    # residuals are computed FROM -- carry the actual signal and stay checked.
    exclude_variables:
      - err_Fax
      - err_M1
      - err_M2
      - err_omega2

  # ---- Backlash / contact loss: PlanetaryGearboxPlan.md section 4.16.5, and G7 needs it ----
  # Run TWICE, deliberately. The pair is a switch test: the second case differs from the
  # first ONLY in gearMesh.useBacklash, so anything that moves between them is attributable
  # to the dead zone and nothing else. err_F is identically zero in BOTH -- the closed form
  # is written against gearMesh.b_eff -- so the discriminators are t_separated, gap_measured
  # and b_eff, which is the point of pairing them rather than running one and asserting.
  - name: GearMeshBacklashCheck
    enabled: true
    model: RotorDynamics.TestModels.GearMeshBacklashCheck
    start_time: 0.0
    final_time: 0.5
    # Exactly one sweep period at f_sweep = 2 Hz, so d_tsep's closed form (a per-period
    # average) is directly readable at the endpoint.
    ncp: 2000
    # ROUND 2: 1e-12 (2026-09-03, was 1e-10 then 1e-11). The first 10x round (1e-10->1e-11,
    # tolerance 1e-3->1e-4) fixed F_sep_scaled and gearMesh.F_sep outright and cut
    # err_delta/err_gap/d_tsep by ~10-40x but not all the way -- d_tsep 2.3e-5, err_delta
    # 7.3e-5, err_gap 1.65e-9 (right at the 1e-9 floor). Tightened another 10x, together.
    rtol: 1.0e-11
    tolerance: 1.0e-4
    timeout_seconds: 1800
    modifiers: {}
    variables: [time, gearMesh.b_eff, gearMesh.delta, gearMesh.F_loa, gearMesh.F_tang,
                gearMesh.F_sep, gearMesh.sigma, gearMesh.k_mesh, gearMesh.r_b1,
                err_delta, err_F, err_Ftang, err_sigma, err_gap, d_tsep,
                gap_measured, lostMotion1, t_separated, nSeparations, F_sep_scaled]
    exclude_variables: [err_delta, err_gap, d_tsep]

  - name: GearMeshBacklashCheck_NoBacklash
    enabled: true
    model: RotorDynamics.TestModels.GearMeshBacklashCheck
    start_time: 0.0
    final_time: 0.5
    ncp: 2000
    # ROUND 2: 1e-12 (was 1e-10 then 1e-11), same pattern and reason as GearMeshBacklashCheck
    # above -- round 1 fixed F_sep_scaled/gearMesh.F_sep but left err_delta (6.8e-5),
    # err_gap (1.65e-9, at the floor) and t_separated (5.8e-10) short of passing.
    rtol: 1.0e-11
    tolerance: 1.0e-4
    timeout_seconds: 1800
    # The control. b_eff collapses to 0, the dead zone disappears, and the same rig must give
    # a continuous piecewise-linear spring through the origin: F_loa sweeps +/-14000 N.
    # t_separated must be numerically zero (6.8e-11 s measured -- the two zero-width sigma = 0
    # instants at delta = 0 have no duration) and gap_measured 1e-14 m.
    exclude_variables: [err_delta, err_gap, d_tsep]
    # rtol 1e-12, NOT the main case's 1e-11: t_separated here is a TRUE zero (the control's
    # own discriminator -- see nSeparations' doc, "t_separated and err_gap are the
    # discriminators"), not a redundant residual, and needed the tighter precision to read
    # as 0 (5.5e-10 at 1e-11, clean at 1e-12). tolerance stays 1e-4, same as the main case.
    rtol: 1.0e-12
    modifiers:
      gearMesh.useBacklash: false
    variables: [time, gearMesh.b_eff, gearMesh.delta, gearMesh.F_loa, gearMesh.F_tang,
                gearMesh.F_sep, gearMesh.sigma, gearMesh.k_mesh, gearMesh.r_b1,
                err_delta, err_F, err_Ftang, err_sigma, err_gap, d_tsep,
                gap_measured, lostMotion1, t_separated, nSeparations, F_sep_scaled]

  # ---- GearMesh Phase B: the mesh as the model's only excitation source ----
  - name: GearMeshExcitationCheck
    enabled: true
    model: RotorDynamics.TestModels.GearMeshExcitationCheck
    start_time: 0.0
    # The model's own annotation grid is kept here, not reduced: this rig exists to carry a
    # tooth-mesh-frequency oscillation (500 Hz at 1500 rpm with z1 = 20) plus the housing
    # ringing it drives, and thinning that is the one thing that would make the stored
    # trajectory a different signal rather than the same one at lower density.
    final_time: 0.3
    ncp: 15000
    rtol: 1.0e-7
    tolerance: 0.01
    modifiers: {}
    variables: [time, gearMesh.z1, gearMesh.z2, gearMesh.k_mesh, gearMesh.k_t,
                gearMesh.eps_alpha, gearMesh.duty, gearMesh.delta, gearMesh.F_loa,
                gearMesh.f_mesh, gearMesh.e_ste, gearMesh.env1, gearMesh.inContact,
                gear1.flange_a.theta, gear1.omega, gear2.omega, "housingA_acc.a_out*"]

  # ---- GearMesh: a spalled tooth and an eccentric wheel on the same rig ----
  - name: GearboxToothFaultDemo
    enabled: true
    model: RotorDynamics.Examples.GearboxToothFaultDemo
    start_time: 0.0
    # Extends GearMeshExcitationCheck, so the same span and grid: 0.3 s is 7.5 shaft
    # revolutions at 1500 rpm, several passes of the once-per-revolution tooth fault, which
    # is what a regression needs. The report runs the same model out to 0.7 s because ITS
    # question is a sideband spectrum, not reproducibility.
    final_time: 0.3
    ncp: 15000
    rtol: 1.0e-7
    tolerance: 0.01
    modifiers: {}
    variables: [time, gearMesh.z1, gearMesh.z2, gearMesh.k_mesh, gearMesh.k_t,
                gearMesh.eps_alpha, gearMesh.duty, gearMesh.delta, gearMesh.F_loa,
                gearMesh.f_mesh, gearMesh.e_ste, gearMesh.env1, gearMesh.inContact,
                gear1.flange_a.theta, gear1.omega, gear2.omega, "housingA_acc.a_out*"]

  # ---- GearMesh Phase D: angle-synchronous motor ripple, friction, power balance ----
  - name: GearMeshRippleTorqueCheck
    enabled: true
    model: RotorDynamics.TestModels.GearMeshRippleTorqueCheck
    start_time: 0.0
    # Ripple order 6/rev = 150 Hz at 1500 rpm, mesh 500 Hz; 20 kHz sampling is 40 points per
    # mesh cycle. Model defaults are used deliberately (tau_mean = 50, tau_ripple = 5, all
    # four bearings with useFriction = true) so the case tests the rig as shipped.
    final_time: 0.6
    ncp: 12000
    rtol: 1.0e-7
    tolerance: 0.01
    modifiers: {}
    variables: [time, gear1.omega, gear2.omega, gear1.flange_a.theta,
                "housingA_acc.a_out*", P_in, P_out, P_loss, P_resid,
                startProduct.y, tau_mean, N_ripple, D_load, gearMesh.z1, gearMesh.z2]

  # ---- GearMesh Phase D: two meshes in series on three parallel shafts ----
  - name: TwoStageGearboxDemo
    enabled: true
    model: RotorDynamics.Examples.TwoStageGearboxDemo
    start_time: 0.0
    # Two mesh frequencies, not harmonically related, and an intermediate shaft belonging to
    # both -- the case that would catch a sign error appearing only in a train.
    #
    # final_time 0.20 s, not 0.7 s (2026-09-03): this model's own credibility-notebook
    # validation (verify_two_stage_gearbox()) already runs it as a SEPARATE, independent
    # experiment at t_final=0.7 s / ncp=35000 -- the horizon its analysis window
    # [0.30, 0.66] s needs -- so shortening THIS case costs that claim nothing (regression-
    # testing skill 12c/12d, modelica-equation-modeling 20). Offline analysis: transient
    # settles by 0.153 s, slowest significant content afterward has a 0.0075 s period, 0.20 s
    # clears 5 cycles with margin.
    final_time: 0.20
    ncp: 4000
    rtol: 1.0e-7
    tolerance: 0.01
    modifiers: {}
    variables: [time, gear1.omega, gear2.omega, gear4.omega,
                mesh1.f_mesh, mesh2.f_mesh, mesh1.delta, mesh2.delta,
                mesh1.F_loa, mesh2.F_loa, mesh1.a_centre, mesh2.a_centre,
                "acc1.a_out*", "acc2.a_out*", "acc3.a_out*"]

  # ---- GearMesh Phase E: HorizontalHousing.useMultiBodyAnchor is a true no-op ----
  - name: MultiBodyAnchoredHousingCheck
    enabled: true
    model: RotorDynamics.TestModels.MultiBodyAnchoredHousingCheck
    start_time: 0.0
    # Three rigs whose difference variables (d_rB, d_fC, ...) are ~1e-16 by construction. A
    # funnel tolerance relative to a reference range that IS numerical noise is meaningless,
    # so these will auto-classify steady_state (endpoint vs. |reference|) -- verify that
    # classification when the reference is first stored rather than assuming it.
    final_time: 0.2
    ncp: 1000
    rtol: 1.0e-9
    modifiers: {}
    variables: [time, "d_rB*", "d_rC*", "d_fB*", "d_fC*", "discA.r_c*",
                "bearingA.support.f*"]

  # ---- GearMesh Phase E: the mesh cross-checks its own installation geometry ----
  - name: GearMeshGeometryCheck
    enabled: true
    model: RotorDynamics.TestModels.GearMeshGeometryCheck
    start_time: 0.0
    # The consistent-layout run only. The deliberate-failure variants (2 mm of centre-distance
    # error, 20 mrad of direction error) are assertion tests, not trajectory tests: they
    # belong in the report, which checks that the asserts actually fire, not here.
    final_time: 0.1
    ncp: 200
    rtol: 1.0e-8
    modifiers: {}
    variables: [time, a_nom, gearMesh.a_centre, gearMesh.phi_centreline, gearMesh.r_b2,
                gearMesh.a_actual, gearMesh.phi_actual, gearMesh.F_loa, gearMesh.delta,
                "rAnchor1.r*", "rAnchor2.r*"]

  # ---- Phase F: locating vs. floating bearing ----
  - name: RollerBearingThrustReactionCheck
    enabled: true
    model: RotorDynamics.TestModels.RollerBearingThrustReactionCheck
    start_time: 0.0
    # Purely algebraic in the axial channel (d_za = 0, and the axial network is massless
    # here), so the only dynamics are the applied ramp.
    final_time: 0.05
    ncp: 500
    rtol: 1.0e-9
    modifiers: {}
    variables: [time, F_thrust, c_za, s_target, bearing1.F_za, bearing1.s_mid,
                bearing1.delta_za, bearing2.F_za, F_float, F_toGround]

  # ---- Phase F: two locating bearings share thrust by stiffness ----
  - name: TwoLocatingBearingSplitCheck
    enabled: true
    model: RotorDynamics.TestModels.TwoLocatingBearingSplitCheck
    start_time: 0.0
    final_time: 0.05
    ncp: 500
    rtol: 1.0e-9
    modifiers: {}
    variables: [time, F_thrust, c_za1, c_za2, s_target, F1_target, F2_target,
                bearing1.F_za, bearing2.F_za, bearing1.s_mid, F_residual]

  # ---- Phase F: contact angle moves the ball-pass frequencies ----
  - name: AngularContactFaultFrequencyCheck
    enabled: true
    model: RotorDynamics.TestModels.AngularContactFaultFrequencyCheck
    start_time: 0.0
    # Deliberately the same span and grid as HousingAccelerationCheck above -- this is the
    # same rig -- so the two cases differ in exactly one parameter, which is the point of the
    # model. ncp is tier 3 (>=10 stored points across the shortest contact pulse).
    final_time: 0.05
    ncp: 50000
    rtol: 1.0e-9
    # alpha_contact = 25 deg. At the model's default of 0 this case would be a duplicate of
    # HousingAccelerationCheck, bit-for-bit -- the whole content of the case is the non-zero
    # contact angle.
    modifiers:
      alpha_contact: 0.4363323129985824
    # Carried over from HousingAccelerationCheck, whose impulsive aSensor.a_out needed both:
    # PROVISIONAL until re-verified against this case's own stored reference.
    tolerance: 0.03
    integral_abs_variables: ["aSensor.a_out*"]
    integral_tolerance: 0.03
    variables: [time, alpha_contact, omega_run, k_cage_target, f_imp_target,
                bearing.f_imp, "aSensor.a_out*"]

  # ---- Phase F: helical thrust into the locating bearing's own pedestal ----
  - name: HelicalThrustLocatedShaftCheck
    enabled: true
    model: RotorDynamics.TestModels.HelicalThrustLocatedShaftCheck
    start_time: 0.0
    final_time: 0.2
    ncp: 2000
    # rtol 1e-8 -> 1e-10 (2026-09-03): the settled axial equilibrium (F_ax1 and everything
    # downstream of it: both bearings' F_za, both housing flanges' f) shifted ~0.11% at the
    # routine 100x check factor -- monotonic in rtol (0.011% at rtol_factor 1, same case),
    # so this is the ordinary two-rtols gap (skill 4/11.3), not a modeling defect. Tightening
    # two decades, per 11.3's rule, lands the 100x-loosened run at 1e-8, where it already
    # agrees to ~1e-5 relative -- 14/14 clean, ~125x margin under the 0.1% tolerance.
    rtol: 1.0e-10
    modifiers: {}
    variables: [time, c_za, c_z, F_ax_target, s_target, gearMesh.F_ax1, gearMesh.r_b2,
                gearMesh.phi_t, gearMesh.beta, bearing1.F_za, bearing1.s_mid,
                bearing2.F_za, housing1.axialFlange.f, housing2.axialFlange.f,
                F_axialResidual]

  # ---- Axial inertia A1: Newton on a free thrust line ----
  - name: AxialMassNewtonCheck
    enabled: true
    model: RotorDynamics.TestModels.AxialMassNewtonCheck
    start_time: 0.0
    # A parabola in s and a straight line in v: nothing here needs resolution.
    final_time: 0.05
    ncp: 500
    rtol: 1.0e-9
    modifiers: {}
    variables: [time, a_target, v_target, s_target,
                axialMass.v, axialMass.s, axialMass.m_total, F_axial]

  # ---- Axial inertia A2: the axial mode's frequency and damping ----
  - name: AxialModeFrequencyCheck
    enabled: true
    model: RotorDynamics.TestModels.AxialModeFrequencyCheck
    start_time: 0.0
    # 78.6 Hz mode; 5000 points over 0.2 s is 25 kHz, ~320 samples per cycle -- tier 4
    # (smooth continuous response), comfortably above the 50-100/period rule of thumb.
    final_time: 0.2
    ncp: 5000
    rtol: 1.0e-9
    modifiers: {}
    variables: [time, x_ring, bearing1.delta_za, axialMass.m_total, axialMass.v,
                f_n_target, s_inf, zeta_qm, c_za, t_step]

  # ---- Axial inertia A4: inertia adds no weight, and the cross-check agrees ----
  - name: AxialMassVerticalWeightCheck
    enabled: true
    model: RotorDynamics.TestModels.AxialMassVerticalWeightCheck
    start_time: 0.0
    # Static: a rigid ThrustBearing prescribes the axial position, so nothing moves at all.
    # m_phantom stays 0 -- the deliberate-error variant is an assertion test and belongs in
    # the report, not here.
    final_time: 0.01
    ncp: 200
    rtol: 1.0e-9
    modifiers: {}
    variables: [time, F_thrust, F_expected, F_weightResidual,
                axialMass.m_total, m_phantom]

  # ---- Axial inertia A3: the composed helical thrust path's axial modes ----
  - name: HelicalAxialModeCheck
    enabled: true
    model: RotorDynamics.TestModels.HelicalAxialModeCheck
    start_time: 0.0
    # At the model's default zeta_axial = 0.05 the 4149 Hz and 1799 Hz modes decay within
    # milliseconds of the load ramp, so what this case actually freezes is the ramp transient
    # plus the settled load path. 10 kHz sampling resolves the ramp-driven content; the modes
    # themselves are measured in the report on a lightly damped variant, which is a
    # measurement, not a regression.
    final_time: 0.2
    ncp: 10000
    rtol: 1.0e-8
    modifiers: {}
    variables: [time, bearing1.s_mid, bearing2.s_mid, gearMesh.F_ax1, f_n1, f_n2,
                c_series, axialMass1.m_total, axialMass2.m_total]

  # ---- Axial inertia 4.5: VerticalHousing's own axial pedestal mass (m_eff_z), and the
  # DivideByZero it fixes (a locating bearing's c_za and this component's c_z meeting at a
  # massless node, d_z = 0). Deliberately undamped -- see the model's own documentation for
  # why c_za does not appear in the closed form. The pedestal mass IS bearing1's own OUTER
  # ring (RollerBearing.m_outer, inert there), referenced -- not retyped -- into
  # housing.m_eff_z; bearing1.m_outer is frozen alongside m_eff_z's own consumer-side value
  # so a future edit that breaks the reference (rather than the value) still fails a check.
  - name: VerticalHousingAxialModeCheck
    enabled: true
    model: RotorDynamics.TestModels.VerticalHousingAxialModeCheck
    start_time: 0.0
    # 389.8 Hz mode; 2000 points over 0.1 s is 20 kHz, ~51 samples per cycle -- tier 4
    # (smooth continuous response), at the 50/period floor given how short the run is.
    final_time: 0.1
    ncp: 2000
    rtol: 1.0e-9
    modifiers: {}
    variables: [time, x_ring, housing.axialFlange.s, f_n_target, s_inf, c_z, c_za,
                bearing1.m_outer]

# ---------------------------------------------------------------------------------------
# Ramped excitation (RampUpInitializationPlan.md Phases B-E). Added 2026-08-31.
#
# Every case sets a NON-ZERO t_ramp on purpose. At t_ramp = 0 each of these models reduces
# to one the suite already covers (or to the unramped rig it extends), so the ramp itself
# would go unchecked -- the value of the case is the ramped path.
#
# rtol here follows the rule GearMeshRatioCheck established above: set the case's rtol two
# decades TIGHTER than the tolerance the model actually needs (its own experiment(...)
# annotation, or whatever the report found it needed), so that run_regression()'s 100x
# loosening lands exactly on that requirement rather than two decades below it.
# ---------------------------------------------------------------------------------------

  # ---- Phase B: rampFactor in a radial force source ----
  - name: RampedSpringLoadCheck
    enabled: true
    model: RotorDynamics.TestModels.RampedSpringLoadCheck
    start_time: 0.0
    final_time: 0.05
    ncp: 5000
    # Model annotation asks for 1e-7; 1e-9 here so the 100x-loosened run lands on it.
    rtol: 1.0e-9
    # 0.01 s is the middle of the report's own sweep (0, 0.002, 0.01, 0.02): long enough
    # that the 13.3 kN preload arrives smoothly rather than as a step, short enough that
    # the ramp completes well inside the 0.05 s run.
    modifiers:
      t_ramp: 0.01
    # springLoad.F_applied IS the feature -- the ramped force itself, a large well-scaled
    # quantity, not a difference of two larger ones. rSensor.r_out is preferred over
    # aSensor.a_out as the primary response for the same reason: displacement is the
    # integrated, better-conditioned signal, and the acceleration is kept only because the
    # transient this ramp exists to suppress is an acceleration.
    variables: [time, "springLoad.F_applied*", "rSensor.r_out*", "aSensor.a_out*"]

  # ---- Phase C: rampFactor in Rotor's own static unbalance, at resonance ----
  - name: RampedEccentricRotorCheck
    enabled: true
    model: RotorDynamics.TestModels.RampedEccentricRotorCheck
    start_time: 0.0
    # final_time 1.25 s, not 3.0 s (2026-09-03): the unbalance ramp (t_ramp=1.0 s below)
    # IS the transient offline analysis detects (transient_end measured at 0.9995 s, matching
    # t_ramp almost exactly -- a useful cross-check that the heuristic found the right thing).
    # The settled whirl afterward has a 0.040 s period; 5 cycles is 0.2 s, so 1.25 s clears
    # the ramp with ~0.05 s (1.25 cycles) of margin on top. 2500 points keeps the same
    # 2000/s density as the original 3.0 s / 6000 points (still ~50/cycle, tier 4's floor).
    final_time: 1.25
    ncp: 2500
    rtol: 1.0e-9
    # t_ramp = 1 s with rho = 1: unbalance ramped in over the first third of the run, at
    # resonance, which is also this library's only exercise of Rotor.initMode = SteadySpeed
    # together with a ramp.
    modifiers:
      t_ramp: 1.0
      rho: 1.0
    variables: [time, "rDisc.r_out*", t_ramp, e_unb, zeta, omega_n]

  # ---- Phase D: a ramped fault on a housing, from a steady-state-ish start ----
  - name: RampedFaultInitCheck
    enabled: true
    model: RotorDynamics.TestModels.RampedFaultInitCheck
    start_time: 0.0
    # Tier 3: the bearing's Hertz contact pulses are microseconds wide, and the same >=10
    # stored points per pulse rule that sizes HousingAccelerationCheck applies here.
    final_time: 0.05
    ncp: 50000
    rtol: 1.0e-9
    # initSteadyState stays FALSE. RampedFaultInitCheckConvergenceIssue.md records an
    # unresolved failure with every component at steady-state init; that is an open
    # modelling question, and a regression case is the wrong place to pin it down -- it
    # would either fail for a known reason or freeze a trajectory nobody has validated.
    modifiers:
      t_ramp: 0.01
      initSteadyState: false
    # Impulsive acceleration on a near-zero baseline: same treatment as
    # HousingAccelerationCheck, and PROVISIONAL for the same reason -- re-verify against
    # this case's own stored reference.
    tolerance: 0.03
    integral_abs_variables: ["aSensor.a_out*"]
    integral_tolerance: 0.03
    variables: [time, "aSensor.a_out*", bearing.f_imp, bearing.contact, bearing.F_n,
                bearing.t_c, "bearing.F_imp*", "bearing.F_sd*"]

  # ---- Phase E: the ramp on the full four-bearing IMS rig ----
  - name: RampedIMSBearingTestRigCheck
    enabled: true
    model: RotorDynamics.TestModels.RampedIMSBearingTestRigCheck
    start_time: 0.0
    final_time: 0.05
    ncp: 5000
    # The report runs this rig at 1e-6 -- it is the most expensive model in the library.
    # 1e-8 here so the 100x-loosened regression run lands on that 1e-6 rather than on 1e-4,
    # which would compare two genuinely different solutions.
    rtol: 1.0e-8
    # 0.02 s is ~65 shaft revolutions at the rig's 2000 rpm, and cuts the peak housing
    # acceleration transient by two orders of magnitude versus the instant-on default.
    modifiers:
      t_ramp: 0.02
    tolerance: 0.03
    integral_abs_variables: ["aHousing2.a_out*"]
    integral_tolerance: 0.03
    variables: [time, "aHousing2.a_out*"]

  # ---------------------------------------------------------------------------------
  # Added 2026-09-03 alongside PlanetaryGearboxPlan 4.27.4 (PartialRadialBearing, the
  # replaceable/conditional planet bearings). Two groups:
  #   (a) the four test models 4.27.4 itself added, which had no coverage at all;
  #   (b) five models the credibility notebook already exercises but that were never
  #       registered here -- long-standing gaps, found by diffing the model classes the
  #       notebook references against the `model:` fields in this file.
  # Array variables carry a trailing '*': a bare "x[1]" is read as a GLOB character
  # class, matches the literal name "x1", and the variable then vanishes from the result.
  # ---------------------------------------------------------------------------------

  - name: PlanetaryGearboxSmoke
    # Structural smoke test for the composite; the baseline the two 4.27.4 variants below
    # are compared against. Straddle-mounted (the default), so it also pins the mounting
    # that was there before 4.27.4 made the second bearing conditional.
    enabled: true
    model: RotorDynamics.TestModels.PlanetaryGearboxSmoke
    start_time: 0.0
    final_time: 0.06
    ncp: 3000
    rtol: 1.0e-9
    modifiers: {}
    # NOT ringFlex.*: PlanetaryGearboxSmoke sets useFlexibleRing = false, so the
    # FlexibleRing component does not exist and those patterns match nothing --
    # a filter that matches nothing stores nothing and fails silently (2 variables).
    variables: [time, gearbox.carrier.omega, gearbox.meshSP*F_loa*, gearbox.post*tau_post*]

  - name: PlanetaryOverhungSmoke
    # 4.27.4's conditional planet bearing: straddleMounted = false removes pbB and routes
    # the blank's far flange to its FreeEnd. straddleMounted is Evaluate = true and gates a
    # conditional declaration, so it cannot be reached by a modifier here -- it needs its
    # own model, which is why this is a separate case and not the smoke test with an override.
    enabled: true
    model: RotorDynamics.TestModels.PlanetaryOverhungSmoke
    start_time: 0.0
    # Back to the full 0.06 s of its straddle-mounted sibling. It ran to 0.01 s while the
    # overhung variant cost 403 s CPU for 0.06 s; that turned out to be an event storm in
    # the mesh contact switch (zero backlash puts the unloaded coast flank exactly on its
    # switching threshold), not a property of the mounting. The model now carries 10 um of
    # backlash and the same horizon costs 1.08 s -- 375x -- so the workaround is retired.
    # See PlanetaryGearboxPlan 4.27.8.
    final_time: 0.06
    ncp: 3000
    rtol: 1.0e-9
    modifiers: {}
    # NOT ringFlex.*: PlanetaryGearboxSmoke sets useFlexibleRing = false, so the
    # FlexibleRing component does not exist and those patterns match nothing --
    # a filter that matches nothing stores nothing and fails silently (2 variables).
    variables: [time, gearbox.carrier.omega, gearbox.meshSP*F_loa*, gearbox.post*tau_post*]

  - name: PlanetaryOverhungSmoke_NoBacklash
    # The control for PlanetaryOverhungSmoke, and a DELIBERATE record of a known failure
    # mode: an unphysical parameterisation, not a modelling defect. useBacklash = false sets
    # the mesh contact threshold b_eff to exactly zero, so the unloaded coast flank of a
    # compliantly supported gear sits on its own switching surface and chatters -- 67,582
    # state events and 403 s of CPU for 0.06 s, against 1.18 s with the 30 um half-backlash
    # the real gearing has. Same pairing as GearMeshBacklashCheck / _NoBacklash.
    #
    # 0.015 s ON PURPOSE, and not shorter: the full horizon costs 403 s, which is the very
    # thing this case documents, while at 0.010 s the storm has NOT yet developed -- the
    # speed ramp is still coming up and the case shows 12 events and looks healthy. 0.015 s
    # is the first horizon where the mode is unmistakable (4,150 events against 40).
    #
    # If this case ever gets FASTER or its trajectories change, the contact-switch behaviour
    # has moved -- which is worth knowing, whether or not it was intended.
    enabled: true
    model: RotorDynamics.TestModels.PlanetaryOverhungSmoke
    start_time: 0.0
    final_time: 0.015
    ncp: 500
    rtol: 1.0e-9
    modifiers:
      gearbox.useBacklash: false
    variables: [time, gearbox.carrier.omega, gearbox.meshSP*F_loa*, gearbox.post*tau_post*]
    # The post torques carry the chatter itself, and chatter micro-structure is NOT a
    # reproducible reference: re-simulated at the suite's 100x looser rtol the storm takes a
    # different path through the same switching surface, and these four miss by ~0.5 while
    # carrier.omega and all four mesh forces reproduce to EXACTLY 0.000000. Stored but not
    # compared -- what this case guards is that the macroscopic behaviour is unchanged, and
    # the fact that a chattering trajectory cannot be a trajectory reference is itself part
    # of what the case documents. The magnitude of the failure mode is measured where it can
    # be measured robustly -- as an event COUNT, in the credibility report's
    # validate_backlash_chatter() section.
    exclude_variables:
      - "gearbox.post*tau_post*"

  - name: PlanetaryRollerPlanetBearingSmoke
    # The replaceable half of 4.27.4: planet bearings redeclared from PlainBearing to
    # RollerBearing. Guards the constrainedby interface -- if PartialRadialBearing ever
    # loses a parameter the redeclaration needs, this stops compiling.
    enabled: true
    model: RotorDynamics.TestModels.PlanetaryRollerPlanetBearingSmoke
    start_time: 0.0
    final_time: 0.06
    ncp: 3000
    rtol: 1.0e-9
    modifiers: {}
    # NOT ringFlex.*: PlanetaryGearboxSmoke sets useFlexibleRing = false, so the
    # FlexibleRing component does not exist and those patterns match nothing --
    # a filter that matches nothing stores nothing and fails silently (2 variables).
    variables: [time, gearbox.carrier.omega, gearbox.meshSP*F_loa*, gearbox.post*tau_post*]

  - name: PlanetaryPlanetBearingFaultCheck
    # TRIAGED 2026-09-04: F_pulse_1 fails at --rtol-factor 100 (funnel excess 1.21 on a
    # peak-to-peak of 105.5) and passes at --rtol-factor 1 -- the check-run factor, not a
    # trajectory difference. It is an IMPULSIVE contact force, so what the looser solve moves
    # is the pulse's timing by a fraction of a sample, and a funnel comparison charges the
    # full pulse height for that. Not excluded: unlike an err_*, this IS the signal the case
    # measures. Sized per skill 11.5 as (atoly + reported_error)/ptp = 1.24e-2, x4 for margin.
    variable_tolerances:
      F_pulse_1: 5.0e-2
    # G7's FIFTH fault: a rolling-element defect on a planet bearing, the only bearing in
    # the library whose support moves. err_abs/err_rel measure the ball-pass rate against
    # both candidates (absolute planet spin vs spin relative to the carrier, 27% apart) and
    # let the data say which the library produces -- so BOTH are stored deliberately.
    enabled: true
    model: RotorDynamics.TestModels.PlanetaryPlanetBearingFaultCheck
    start_time: 0.0
    final_time: 0.08
    ncp: 8000
    rtol: 1.0e-8
    modifiers: {}
    variables: [time, err_omega_c, err_omega_p, f_imp_model, err_abs, err_rel,
                F_pulse_1, f_support_1]
    # The err_* residuals settle to ~1e-7 of their own scale -- they are the MODEL's
    # correctness assertions, and comparing two near-zero numbers under the suite's 100x
    # looser re-simulation is a coin toss (they fail at the routine factor and pass at
    # --rtol-factor 1). Nothing is lost: the case's actual result is carried by
    # f_imp_model = 145.4545 Hz and err_abs = 0.272727 = 14/11 - 1, both O(1) or larger,
    # which together say the ball-pass rate is the SUPPORT-RELATIVE one.
    exclude_variables:
      - err_omega_c
      - err_omega_p
      - err_rel

  - name: PlanetaryThreePlanetCheck
    # Three-planet set: the counting factors and mesh phasing differ from the four-planet
    # Inalpolat stage every other planetary case uses, so this covers the N-dependence.
    enabled: true
    model: RotorDynamics.TestModels.PlanetaryThreePlanetCheck
    start_time: 0.0
    final_time: 0.06
    ncp: 3000
    rtol: 1.0e-8
    modifiers: {}
    variables: [time, F_sp_max, F_sp_min, F_sp_mean, loadShareSpread,
                err_omega_c, err_omega_p, err_f_mesh_sp, err_f_mesh_rp,
                err_F_sp, err_F_rp, err_tau_ring, err_tau_carrier,
                loadRatio, err_loadRatio, ringDriven, ringFiltered, ringReject,
                gamma_s*, gamma_r*, err_gamma_s*, err_gamma_r*]
    # Three classes are stored but not compared:
    #   err_*        near-zero residuals, as in PlanetaryPlanetBearingFaultCheck above:
    #                16 of them fail at the routine 100x rtol factor and pass at 1.
    #   gamma_s/r*   mesh phases wrapped by mod(...,1.0). A phase sitting near the wrap
    #                comes back on the other side of it for an arbitrarily small timing
    #                difference, giving a funnel error of exactly 0.999 -- one full wrap,
    #                not a physical change. err_gamma_* is the unwrapped form (it carries
    #                the +0.5 mod trick) and agrees to 1e-11, which is the real verdict.
    #   ringFiltered a 1e-12 rejection floor.
    # What is left is the physics at its own scale: the three mesh forces, the load-share
    # spread and ratio, and the ring's driven/rejected amplitudes.
    exclude_variables:
      - "err_*"
      - "gamma_s*"
      - "gamma_r*"
      - ringFiltered
      # Both settle to ~5e-9 -- three identical planets share load perfectly and the ring
      # rejects the non-driven order completely -- so the steady_state check compares two
      # near-zero numbers and the 100x re-simulation moves them by 1e-7. Their large ptp
      # (3.0 and 47.6) is start-up transient only. Load-sharing coverage is not lost:
      # F_sp_max and F_sp_min are equal to F_sp_mean *because* sharing is perfect, so any
      # defect that breaks it separates them at the 2.3e3 N scale where they are compared.
      - loadShareSpread
      - ringReject

  - name: CouplingMisalignmentCheck
    # final_time is one revolution at 150 rad/s (2*pi/150), matching the model's own
    # experiment annotation.
    enabled: true
    model: RotorDynamics.TestModels.CouplingMisalignmentCheck
    start_time: 0.0
    final_time: 0.0418879020478639
    ncp: 2000
    rtol: 1.0e-9
    modifiers: {}
    variables: [time, theta, Ex, Ey, Angx, Angy,
                r_c1_expected*, phi_c1_expected*, r_c2_expected*, phi_c2_expected*,
                F_expected*, T_expected*]

  - name: SupportAccelerationSensorCheck
    enabled: true
    model: RotorDynamics.TestModels.SupportAccelerationSensorCheck
    start_time: 0.0
    final_time: 0.02
    ncp: 2000
    rtol: 1.0e-9
    modifiers: {}
    variables: [time, a_expected*, d_a*]

  - name: TorqueSourceLargeTwistInitCheck
    # theta_rel is the point of the case: a ~1 degree steady twist (tau_drive/c approx
    # 0.0177 rad) that is unambiguous rather than a fraction of a solver tolerance.
    enabled: true
    model: RotorDynamics.TestModels.TorqueSourceLargeTwistInitCheck
    start_time: 0.0
    final_time: 0.15
    ncp: 1500
    rtol: 1.0e-8
    modifiers: {}
    variables: [time, torsionShaft.theta_rel, disc.omega, loadDisc.omega]

  - name: IMSBearingTestRig
    # The full four-bearing rig. RampedIMSBearingTestRigCheck already covers the ramped
    # variant with two checks; this covers the rig itself, which the credibility report
    # leans on heavily (section 4.3) and which nothing guarded until now.
    #
    # final_time 0.15 s, not the model's own 1.0 s default (2026-09-03): offline analysis of
    # the stored reference found the dominant transient settles by t=0.034 s and the
    # slowest significant content afterward has a 0.0205 s period, so 5 cycles fit inside
    # 0.15 s with margin (regression-testing skill 12c). Confirmed SAFE to shorten
    # independently of section 4.3's credibility-report analysis: the notebook runs this
    # model through its OWN separate Impact experiment (run(IMSRIG, ..., t_final=T_FINAL,
    # ...) in rotordynamics_validation.py), not from this stored reference, so the
    # regression case's horizon has no bearing on the report's spectral claims.
    enabled: true
    model: RotorDynamics.Examples.IMSBearingTestRig
    start_time: 0.0
    final_time: 0.15
    ncp: 750
    rtol: 1.0e-8
    modifiers: {}
    variables: [time, aHousing1.a_out*, rHousing1.r_out*,
                bearing1.f_imp, bearing1.F_n, bearing1.T_imp]

# ---------------------------------------------------------------------------------------
# GearMeshPlan.md Phases I/J (BevelGearMesh) and Phase L (tooth-flank friction), added
# 2026-09-04. All three are closed-form rigs of the same shape as GearMeshRatioCheck above
# -- a 0.1 s speed ramp into a settled load path, no excitation anywhere -- so they inherit
# its ncp/rtol reasoning wholesale, including the 1e-10 rtol (two decades tighter than each
# model's own 1e-8 annotation, so run_regression()'s 100x-looser re-simulation still lands
# where the model actually needs to be; regression-testing skill 11.3).
#
# EVERY err_* IS EXCLUDED, in all three, and deliberately: their reference values are
# numerical zeros (~1e-13), so a regression check would be asking a zero to reproduce to
# within a fraction of zero -- skill 11.2. The raw quantities they are residuals OF are all
# in the variables: list instead, which is what actually answers "did this model change".
# Checking them against closed form is the credibility report's job (sections 3.56, 3.58),
# not the suite's.
# ---------------------------------------------------------------------------------------

  # ---- GearMesh Phase I: straight bevel, 90-degree axes ----
  - name: BevelGearMeshRatioCheck
    enabled: true
    model: RotorDynamics.TestModels.BevelGearMeshRatioCheck
    start_time: 0.0
    final_time: 0.2
    # 2000 points, GearMeshRatioCheck's reasoning: BevelGearMesh is RIGID and LOSSLESS with
    # no stiffness variation and no transmission error, so there is no tooth-rate content
    # here at all -- the only thing the comparison has to reproduce is the ramp and the
    # settled plateau.
    ncp: 2000
    rtol: 1.0e-10
    modifiers: {}
    # The cone angles and mean radii are the derived-geometry chain Phase I introduced; the
    # F_a/F_r pairs are the thrust/radial split that is the whole point of a bevel mesh, and
    # the Sigma = 90 deg identity F_a1 = F_r2 / F_r1 = F_a2 is frozen by having all four.
    variables: [time, tau_load, phi_n,
                bevelMesh.z1, bevelMesh.z2, bevelMesh.m_mean, bevelMesh.phi_n,
                bevelMesh.Sigma, bevelMesh.gamma1, bevelMesh.gamma2,
                bevelMesh.R_m1, bevelMesh.R_m2, bevelMesh.i_ratio,
                bevelMesh.F_tang, bevelMesh.F_rc,
                bevelMesh.F_a1, bevelMesh.F_r1, bevelMesh.F_a2, bevelMesh.F_r2,
                bevelMesh.tau_1, bevelMesh.tau_2, gear1.omega, gear2.omega]
    exclude_variables: [err_Ftang, err_Fa1, err_Fr1, err_Fa2, err_Fr2, err_tau1, P_net]

  # ---- GearMesh Phase J: SPIRAL bevel -- the same component at beta_m = 35 deg ----
  - name: BevelGearMeshRatioCheck_Spiral
    enabled: true
    # The control-vs-treatment pair for Phase J: identical to the case above except for
    # beta_m and rightHandGear1, so a diff of the two references isolates exactly what the
    # spiral angle does. What it must NOT change is F_tang (beta_m does not enter the torque
    # path at all) or either tau; what it MUST change is every F_a/F_r, since the spiral
    # angle rotates each gear's own thrust/radial split. Keeping both cases is what makes
    # that a checkable statement rather than a claim.
    model: RotorDynamics.TestModels.BevelGearMeshRatioCheck_Spiral
    start_time: 0.0
    final_time: 0.2
    ncp: 2000
    rtol: 1.0e-10
    modifiers: {}
    variables: [time, tau_load, phi_n, beta_m,
                bevelMesh.z1, bevelMesh.z2, bevelMesh.m_mean, bevelMesh.phi_n,
                bevelMesh.beta_m, bevelMesh.Sigma, bevelMesh.gamma1, bevelMesh.gamma2,
                bevelMesh.R_m1, bevelMesh.R_m2, bevelMesh.i_ratio,
                bevelMesh.F_tang, bevelMesh.F_rc,
                bevelMesh.F_a1, bevelMesh.F_r1, bevelMesh.F_a2, bevelMesh.F_r2,
                bevelMesh.tau_1, bevelMesh.tau_2, gear1.omega, gear2.omega]
    exclude_variables: [err_Ftang, err_Fa1, err_Fr1, err_Fa2, err_Fr2, err_tau1, P_net]

  # ---- GearMesh Phase L: tooth-flank sliding friction ----
  - name: GearMeshFrictionCheck
    enabled: true
    model: RotorDynamics.TestModels.GearMeshFrictionCheck
    start_time: 0.0
    final_time: 0.2
    # 8000 points, NOT GearMeshRatioCheck's 2000, and this is the one place this case
    # departs from it. Friction is not a settled plateau: xi sweeps a full sawtooth and
    # v_slide REVERSES once per tooth pass, so every friction quantity carries content at
    # the 500 Hz mesh rate for the whole run (100 cycles over 0.2 s). 8000 points is 80 per
    # mesh cycle -- the smooth-continuous-response tier of the ncp table, which is what a
    # trajectory comparison of a mesh-rate signal needs.
    ncp: 8000
    rtol: 1.0e-10
    modifiers: {}
    # The friction chain in causal order -- xi (where the contact is), omega_rel and
    # v_slide (how fast it slides), F_fric (the force), lossPower (the dissipation) -- plus
    # the two torques, which is where the loss has to show up, and F_c/F_loa, which is what
    # scales it. gearMesh.delta is deliberately ABSENT even though GearMeshRatioCheck keeps
    # it: it is a 4.4 um cancellation of two ~0.75 m terms (skill 11.1) and every force here
    # is already proportional to it, so F_loa carries the same information far better
    # conditioned.
    variables: [time, tau_load, omega1, mu_f,
                gearMesh.z1, gearMesh.z2, gearMesh.m_n, gearMesh.phi_t,
                gearMesh.r_b1, gearMesh.r_b2, gearMesh.mu_f, gearMesh.v_eps,
                gearMesh.xi, gearMesh.omega_rel, gearMesh.v_loa_rot, gearMesh.v_slide,
                gearMesh.F_fric, gearMesh.F_c, gearMesh.F_loa, gearMesh.lossPower,
                gearMesh.tau_1, gearMesh.tau_2, gear1.omega, gear2.omega,
                P_ports, P_mesh]
    # gearMesh.F_fric is EXCLUDED, and this is the interesting one. It is not a scale
    # problem and not a stale reference: it fails at --rtol-factor 100 with a funnel excess of
    # 15.7 N and still misses by 0.11 N at --rtol-factor 1. The mechanism is ALIASING of a
    # switching edge. F_fric carries the regularized SIGN of v_slide, and v_slide sweeps
    # +/-0.93 m/s across a tooth pass, so it crosses the v_eps = 1e-4 m/s regularization band
    # in about 0.1 MICROSECONDS -- while the output grid is 25 us. F_fric therefore steps
    # between -178 N and +176 N between two adjacent stored samples, 100 times over the run,
    # and which side of the edge a sample lands on is set by the solver path rather than by
    # the physics. A tolerance that covered it would have to be 18% of peak-to-peak, which
    # would not be a check.
    #
    # Nothing is lost by excluding it, which is the test skill 12d asks first: every quantity
    # F_fric is BUILT from is in variables: and passes cleanly -- F_c (its magnitude, via
    # mu_f*F_c), v_slide (its sign), and lossPower = F_fric*v_slide, which is CONTINUOUS
    # through the reversal because it dips to zero there instead of jumping. lossPower is
    # also the quantity the feature is actually about.
    #
    # gearMesh.tau_1/tau_2 inherit a much smaller version of the same edge (the friction term
    # is +/-0.9 N.m out of a 102 N.m range), pass at --rtol-factor 1, and need 2.0e-3/1.6e-3
    # to pass at 100 -- so they get a targeted 1e-2 rather than an exclusion, per skill 11.5.
    # The torques' own VALUES are pinned to -50/-150 N.m by the credibility report anyway.
    variable_tolerances:
      gearMesh.tau_*: 1.0e-2
    # P_resid is the ACCEPTANCE GATE (3.6e-12 W, a computed numerical zero) and err_power is
    # its normalized form -- both are exactly skill 11.2's "deviation variable that cannot be
    # regression-checked": asking a 1e-12 to reproduce to within 0.1% of itself. The gate
    # belongs in the credibility report (section 3.58), which checks it against a tolerance
    # that means something. P_ports and P_mesh, the two O(10-100 W) quantities it is the
    # difference of, ARE checked -- that is skill 11.1's "prefer the well-conditioned
    # quantity the cancellation is formed from", and between them they pin the same physics.
    exclude_variables: [P_resid, err_power, gearMesh.F_fric]

  # ---- GearMeshPlan.md Phases I/J + F composed: a real right-angle drive ----
  - name: SpiralBevelDriveDemo
    enabled: true
    # The composition case: a spiral-bevel mesh whose thrust is reacted at each shaft's own
    # locating bearing and pedestal, rather than at a rigid boundary. What it guards that
    # BevelGearMeshRatioCheck_Spiral does not is the LOAD PATH -- s_shaft1 is the series
    # compliance of the bearing and the pedestal, a number neither component produces alone,
    # and F_toHousing1/F_toHousing2 are deliberately NOT equal and opposite (at a right angle
    # one gear's axial direction is the other's transverse one, so the two axial networks
    # carry different forces). A sign or path error in either would show here and nowhere else.
    model: RotorDynamics.Examples.SpiralBevelDriveDemo
    start_time: 0.0
    final_time: 0.2
    # Rigid, lossless, no stiffness variation and no transmission error: a ramp into a settled
    # plateau, so 2000 points resolve everything the comparison sees -- GearMeshRatioCheck's
    # own reasoning.
    ncp: 2000
    rtol: 1.0e-10
    modifiers: {}
    variables: [time, tau_load, beta_m,
                bevelMesh.gamma1, bevelMesh.gamma2, bevelMesh.R_m1, bevelMesh.R_m2,
                bevelMesh.F_tang, bevelMesh.F_a1, bevelMesh.F_r1,
                bevelMesh.F_a2, bevelMesh.F_r2, bevelMesh.tau_1, bevelMesh.tau_2,
                spiralThrustFactor, F_mesh_resultant,
                F_toHousing1, F_toHousing2, s_shaft1,
                bearing1.F_za, bearing2.F_za, gear1.omega, gear2.omega]
    # F_axialResidual1 is a STRUCTURAL zero (the axial equilibrium of a line whose far end is
    # free), i.e. exactly the "assigned rather than computed zero" skill 11.2 says is safe --
    # but it is assigned by a force balance the solver enforces, not by an if-branch, so it
    # lands at solver noise rather than at 0.0 and cannot be regression-checked. bearing1.F_za
    # carries the same information with real magnitude and IS checked.
    exclude_variables: [F_axialResidual1]

  # ---- GearMesh Phase H2: helical contact-line attenuation ----
  - name: GearMeshOverlapAttenuationCheck
    enabled: true
    # Run at eps_beta = 0.5 -- deliberately NOT at the model's own default of 1.0. At integer
    # overlap ratio every harmonic's sinc factor is zero at once, so kRel is identically zero
    # and the case would freeze a trajectory with no content in it: it would pass whether or
    # not the filter existed. 0.5 is where the filter is doing the most work (sinc = 0.6366,
    # a 36% attenuation) and where getting it wrong is most visible. The null itself is a
    # credibility-report claim (section 3.60), which is the right place for it -- a regression
    # suite freezing a zero learns nothing.
    model: RotorDynamics.TestModels.GearMeshOverlapAttenuationCheck
    start_time: 0.0
    final_time: 0.2
    # 8000 points: kRel carries tooth-mesh content at 500 Hz and its 5 harmonics for the whole
    # run, so this is the same sizing as GearMeshOrbitInvarianceCheck, not GearMeshRatioCheck's.
    ncp: 8000
    rtol: 1.0e-10
    modifiers:
      epsBetaTarget: 0.5
    variables: [time, epsBetaTarget, b_face, kRel, kRelTarget, tau2,
                gearMesh.eps_beta, gearMesh.eps_alpha, gearMesh.lineFactor*,
                gearMesh.k_t, gearMesh.k_mesh, gearMesh.theta_m,
                gearMesh.delta, gearMesh.F_loa, gearMesh.tau_1]
    # err_kwave, err_lineFactor1 and err_epsBeta are all deviation-from-closed-form variables
    # whose reference values are numerical zeros (1.7e-16, 0.0, 0.0) -- skill 11.2. kRel and
    # kRelTarget, the two O(0.6) quantities err_kwave is the difference of, are both checked
    # instead, which pins the same physics with four decades more headroom.
    exclude_variables: [err_kwave, err_lineFactor1, err_epsBeta]

  # ---- GearMesh Phase H1: profile shift ----
  - name: GearMeshProfileShiftCheck
    enabled: true
    # Run at the model's own default x1 = 0.4, x2 = 0.2 -- a GENUINE shift, not the zero
    # default. The point of the case is the operating geometry (phi_tw = 22.108 deg against a
    # reference 20 deg, a_w = 121.712 mm against a reference 120 mm) together with the two
    # things that must NOT move with it: r_b1/r_b2 and i_ratio. Freezing all five in one
    # trajectory is what makes a future edit that leaks the operating angle into the torque
    # relation, or the reference angle into the force directions, visible here.
    model: RotorDynamics.TestModels.GearMeshProfileShiftCheck
    start_time: 0.0
    final_time: 0.2
    # No excitation, both axes rigidly pinned, useLateralCoupling off: a ramp into a settled
    # plateau, so GearMeshRatioCheck's 2000 points resolve everything the comparison sees.
    ncp: 2000
    # 1e-10 for GearMeshRatioCheck's own reason -- gearMesh.delta is a micron-scale
    # cancellation of two ~0.75 m rotating terms and every force here inherits it.
    rtol: 1.0e-10
    modifiers: {}
    variables: [time, x1, x2, da_centre, tau1_settled,
                gearMesh.phi_t, gearMesh.phi_tw, gearMesh.x_sum, gearMesh.z_sum,
                gearMesh.a_centre, gearMesh.a_w, gearMesh.r_w1, gearMesh.r_w2,
                gearMesh.r_b1, gearMesh.r_b2, gearMesh.r_a1, gearMesh.r_a2,
                gearMesh.eps_alpha, gearMesh.i_ratio,
                gearMesh.F_loa, gearMesh.F_tang, gearMesh.F_sep, gearMesh.delta,
                gearMesh.tau_1, gearMesh.tau_2, gear1.omega, gear2.omega]
    # Every err_* here is a deviation-from-closed-form whose reference value is a numerical
    # zero (err_involute 1.7e-16, err_rw1/err_rw2/err_aw exactly 0) -- skill 11.2. The raw
    # quantities they are residuals of (phi_tw, r_w1, r_w2, a_w, tau_1, F_loa, the two shaft
    # speeds) are all checked instead, which pins the same physics with real magnitudes.
    exclude_variables: [err_tau1, err_omega2, err_involute, err_rw1, err_rw2, err_aw]

  # ---- GearMesh Phase L, the LATERAL friction path ----
  - name: GearMeshFrictionVibrationCheck
    enabled: true
    # GearMeshFrictionCheck guards the friction TORQUE channel and the power balance on a
    # rigid rig. This case guards the other half, which nothing else touches: friction acts
    # along n_perp, so it also injects a LATERAL force, and here that force has four bearings
    # and four housings to travel through. A sign error in the n_perp component of F_1/F_2
    # would leave the power balance closing perfectly (it is the same F_fric either way) and
    # would show up only here. Report section 3.62.
    model: RotorDynamics.TestModels.GearMeshFrictionVibrationCheck
    start_time: 0.0
    final_time: 0.3
    # 12000 points = 40 kHz on a 0.3 s run. The highest content that matters is the 5th mesh
    # harmonic at 2500 Hz, so this is 16 samples per cycle of the fastest line -- comfortably
    # into the smooth-response tier, and far cheaper than the 60000 the credibility report's
    # own FFT uses (that one needs the resolution; a trajectory comparison does not).
    ncp: 12000
    # The model's own annotation is 1e-7; 1e-9 here so the 100x check run lands back on it.
    rtol: 1.0e-9
    modifiers:
      mu_f: 0.05
    variables: [time, mu_f, gearMesh.f_mesh, gearMesh.k_t, gearMesh.delta,
                gearMesh.F_loa, gearMesh.v_slide, gearMesh.lossPower,
                gearMesh.tau_1, gearMesh.tau_2,
                gear1.omega, gear2.omega, housingA_acc.a_out*]
    # gearMesh.F_fric is excluded for the reason spelled out at GearMeshFrictionCheck: it is a
    # 0.1 us switching edge sampled on a 25 us grid, so which side of the reversal a sample
    # lands on is set by the solver path. Its magnitude, its sign and its product with
    # v_slide are all pinned by other variables in this same list.
    exclude_variables: [gearMesh.F_fric]
